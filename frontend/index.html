<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: respeta el notch / isla dinámica del iPhone.
         No se bloquea el zoom: en planta, con guantes y polvo, hace falta poder ampliar. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#16233b" />
    <meta name="description" content="SGIT-CCTV — Gestión de Infraestructura Tecnológica y CCTV. Aceros Arequipa, Planta Pisco." />
    <!-- Permite instalarlo como app desde la pantalla de inicio del celular -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SGIT-CCTV" />
    <!-- Bloque 173 · sin icono, cada pantalla pedía /favicon.ico y salía un 404 en la consola. -->
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%2316233b'/%3E%3Ccircle cx='16' cy='16' r='8' fill='none' stroke='%23e11d2e' stroke-width='3'/%3E%3Ccircle cx='16' cy='16' r='3' fill='%23e11d2e'/%3E%3C/svg%3E" />
    <title>SGIT-CCTV · Aceros Arequipa</title>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
