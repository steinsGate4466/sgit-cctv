# =============================================================================
#  SGIT-CCTV — TODO EL SISTEMA EN UN SERVIDOR PROPIO
#  Aceros Arequipa · Planta Pisco · Laminación
# =============================================================================
#  PARA QUÉ SIRVE ESTE ARCHIVO
#
#  Hoy el sistema vive en Railway. Esto es para el día en que TI diga «esto se
#  queda dentro de la planta»: un solo comando levanta las cuatro piezas en un
#  servidor de Aceros, sin depender de ningún proveedor externo.
#
#      docker compose up -d
#
#  Y también sirve hoy mismo para trabajar en local con la misma base de datos
#  y el mismo almacén de fotos que hay en producción, en vez de aproximaciones.
#
# -----------------------------------------------------------------------------
#  LAS CUATRO PIEZAS
#    postgres  — la base de datos. TODO el sistema vive aquí.
#    minio     — las fotos de campo y los informes. Archivos, no base.
#    backend   — la API (NestJS 11 + Prisma 7).
#    frontend  — las pantallas ya compiladas.
#
# -----------------------------------------------------------------------------
#  ANTES DE ARRANCAR: LOS SECRETOS
#
#  Este archivo NO contiene ni una contraseña. Las lee de un archivo `.env` que
#  vive al lado y que NO se guarda en el repositorio. Se crea copiando el
#  ejemplo:
#
#      cp .env.compose.ejemplo .env
#
#  ...y rellenando los valores. Los de planta se generan en el servidor y no se
#  escriben en ningún chat, correo ni captura de pantalla.
#
# -----------------------------------------------------------------------------
#  LOS DATOS NO SE BORRAN AL PARAR
#
#  Los `volumes` de abajo guardan la base y las fotos FUERA de los
#  contenedores. `docker compose down` para el sistema y los datos siguen ahí.
#
#  Lo único que sí borra es `docker compose down -v`. Ese `-v` borra los
#  volúmenes, y con ellos la base entera. En un servidor de planta ese comando
#  no se escribe nunca sin haber comprobado antes que hay respaldo.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  #  LA BASE DE DATOS
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: sgit-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en el archivo .env}
      POSTGRES_DB: ${POSTGRES_DB:-sgit_cctv}
      # Español de Perú para que los ordenamientos y las fechas salgan bien.
      LANG: es_PE.utf8
    volumes:
      - postgres-datos:/var/lib/postgresql/data
    # El puerto se expone SOLO a esta máquina (127.0.0.1). En un servidor de
    # planta, dejar 5432 abierto a la red es ofrecer la base entera a cualquiera
    # que se conecte al switch. Los contenedores se hablan por la red interna
    # de Docker y no necesitan este puerto.
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-sgit} -d ${POSTGRES_DB:-sgit_cctv}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  #  EL ALMACÉN DE ARCHIVOS (fotos de campo, informes en PDF)
  # ---------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: sgit-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Falta MINIO_ROOT_USER en el archivo .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Falta MINIO_ROOT_PASSWORD en el archivo .env}
    volumes:
      - minio-datos:/data
    ports:
      # 9000 es la API que usa el backend. 9001 es la consola web para mirar
      # los archivos a mano. Las dos, sólo desde esta máquina.
      - '127.0.0.1:9000:9000'
      - '127.0.0.1:9001:9001'
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ---------------------------------------------------------------------------
  #  LA API
  # ---------------------------------------------------------------------------
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sgit-backend
    restart: unless-stopped
    # NO arranca hasta que la base responde de verdad. Sin esto, el contenedor
    # se levanta, no encuentra la base, se cae, reinicia... y llena el registro
    # de errores que parecen graves y sólo eran prisa.
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: '3000'
      # `postgres` es el nombre del servicio de arriba: dentro de la red de
      # Docker eso resuelve a la base. Y `conexion.ts` reconoce ese nombre como
      # local, así que NO intenta cifrar — una base en la misma máquina no lo
      # necesita y el contenedor de PostgreSQL no lo ofrece.
      DATABASE_URL: >-
        postgresql://${POSTGRES_USER:-sgit}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sgit_cctv}?schema=public
      MINIO_ENDPOINT: minio
      MINIO_PORT: '9000'
      MINIO_USE_SSL: 'false'
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-sgit-cctv}
      # Los tres secretos de la aplicación. Sin valores por defecto A PROPÓSITO:
      # si faltan, el arranque falla aquí y no en planta con una clave conocida.
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en el archivo .env}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Falta JWT_REFRESH_SECRET en el archivo .env}
      CREDENTIAL_ENC_KEY: ${CREDENTIAL_ENC_KEY:?Falta CREDENTIAL_ENC_KEY en el archivo .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080}
    ports:
      - '127.0.0.1:3000:3000'

  # ---------------------------------------------------------------------------
  #  LAS PANTALLAS
  # ---------------------------------------------------------------------------
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
      args:
        # La dirección de la API se HORNEA al compilar: Vite la incrusta en el
        # paquete. Cambiarla obliga a reconstruir esta imagen, no basta con
        # reiniciar el contenedor.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    container_name: sgit-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      PORT: '8080'
    # ESTE SÍ se abre a la red: es la única pieza que la gente de planta abre
    # en su navegador. El resto queda detrás.
    ports:
      - '${FRONTEND_PORT:-8080}:8080'

# =============================================================================
#  DONDE VIVEN LOS DATOS DE VERDAD
#  -----------------------------------------------------------------------------
#  Sobreviven a `docker compose down`, a reiniciar el servidor y a reconstruir
#  las imágenes. Sólo los borra `down -v`.
#
#  RESPALDO: el script `scripts/respaldo.sh` del bloque F8-B saca el volcado de
#  `postgres-datos`. En un servidor de planta eso va programado, y el respaldo
#  se prueba restaurándolo — un respaldo que nunca se ha restaurado no es un
#  respaldo, es un archivo.
# =============================================================================
volumes:
  postgres-datos:
    name: sgit-postgres-datos
  minio-datos:
    name: sgit-minio-datos
