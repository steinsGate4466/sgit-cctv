<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" font-family="Segoe UI, Calibri, Arial, sans-serif">
<defs>
  <marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
  </marker>
  <style>
    .task  { fill:#E4EAF6; stroke:#2E75B6; stroke-width:2.4; }
    .taskG { fill:#DDEFDC; stroke:#3B7D3B; stroke-width:3;   }
    .taskS { fill:#DCE9F7; stroke:#1F5FA8; stroke-width:2.6; }
    .taskW { fill:#FDEBD0; stroke:#B9770E; stroke-width:3.2; }
    .gw    { fill:#FBF8C8; stroke:#A09A2E; stroke-width:2.4; }
    .txt   { font-size:14px; fill:#1A1A1A; }
    .txtg  { font-size:14px; fill:#1E5B1E; font-weight:600; }
    .lbl   { font-size:12.5px; fill:#3A3A3A; }
    .lblg  { font-size:12.5px; fill:#2E7D32; font-style:italic; }
    .lblu  { font-size:12px;  fill:#1F5FA8; font-weight:600; }
    .lane  { font-size:17px; fill:#2A2A2A; font-weight:700; letter-spacing:.6px; }
    .sub   { font-size:12px; fill:#6A6A6A; }
