<text x="76" y="1019" font-size="13" fill="#3A3A3A">Actividad</text>
<rect x="168" y="1004" width="26" height="19" rx="6" fill="#DDEFDC" stroke="#3B7D3B" stroke-width="2.8"/>
<text x="204" y="1019" font-size="13" fill="#3A3A3A">🔒 El sistema lo EXIGE — no se puede saltar</text>
<rect x="530" y="1004" width="26" height="19" rx="6" fill="#DCE9F7" stroke="#1F5FA8" stroke-width="2.4"/>
<text x="566" y="1019" font-size="13" fill="#3A3A3A">⚙ Lo hace el sistema solo</text>
<rect x="790" y="1004" width="26" height="19" rx="6" fill="#FDEBD0" stroke="#B9770E" stroke-width="3"/>
<text x="826" y="1019" font-size="13" fill="#3A3A3A">Aviso de seguridad — va SIEMPRE arriba del todo</text>
<path d="M1180,1013 L1196,1002 L1212,1013 L1196,1024 Z" fill="#FBF8C8" stroke="#A09A2E" stroke-width="2.2"/>
<text x="1222" y="1019" font-size="13" fill="#3A3A3A">Compuerta exclusiva</text>
<circle cx="1390" cy="1013" r="11" fill="#DDEFDC" stroke="#2E7D32" stroke-width="3.4"/>
<text x="1408" y="1019" font-size="13" fill="#3A3A3A">Fin — con registro, firma y evidencia</text>
<text x="1874" y="1019" font-size="12.5" fill="#8A8A8A" text-anchor="end">SGIT-CCTV · BPMN del proceso CON el sistema (TO-BE)</text>
