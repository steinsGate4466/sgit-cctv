<line x1="678" y1="191" x2="722" y2="191" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text class="lbl" x="700" y="182" text-anchor="middle" fill="#B02A37">No</text>

<rect class="taskB" x="724" y="151" width="196" height="80" rx="12"/>
<text class="txtb" x="822" y="180" text-anchor="middle">Vuelve a avisar mañana</text>
<text class="txtb" x="822" y="198" text-anchor="middle">…o se olvida</text>
<text class="lblb" x="822" y="218" text-anchor="middle">nadie lleva la cuenta</text>
<line x1="920" y1="191" x2="962" y2="191" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<circle cx="984" cy="191" r="19" fill="#E8A5A5" stroke="#A02B2B" stroke-width="4"/>

<text class="lbl" x="643" y="255" text-anchor="middle" fill="#3A3A3A">Sí</text>
<path d="M640,229 L640,268 L378,268 L378,318" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<!-- ============ CARRIL 2 · MANTENIMIENTO  (cy 421) ============ -->
<rect class="taskB" x="290" y="381" width="182" height="80" rx="12"/>
<text class="txtb" x="381" y="410" text-anchor="middle">Lo anota en un cuaderno</text>
<text class="txtb" x="381" y="428" text-anchor="middle">o en WhatsApp</text>
<text class="lblb" x="381" y="448" text-anchor="middle">o en nada</text>
<line x1="472" y1="421" x2="512" y2="421" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<path class="gw" d="M552,383 L590,421 L552,459 L514,421 Z"/>
<path d="M542,411 L562,431 M562,411 L542,431" stroke="#A09A2E" stroke-width="2.6" fill="none"/>
<text class="lbl" x="552" y="370" text-anchor="middle">¿Qué cámara es?</text>
<line x1="590" y1="421" x2="630" y2="421" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="task" x="632" y="381" width="170" height="80" rx="12"/>
<text class="txt" x="717" y="415" text-anchor="middle">Va a planta</text>
<text class="txt" x="717" y="433" text-anchor="middle">a buscarla</text>
<line x1="802" y1="421" x2="842" y2="421" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="taskB" x="844" y="373" width="222" height="96" rx="12"/>
<text class="txtb" x="955" y="402" text-anchor="middle" font-size="14.5">SUBE AL EQUIPO</text>
<text class="txtb" x="955" y="421" text-anchor="middle" font-size="14.5">SIN SABER</text>
<text class="lblb" x="955" y="441" text-anchor="middle">si hay que parar el tren,</text>
<text class="lblb" x="955" y="457" text-anchor="middle">ni si hay barra caliente debajo</text>
<line x1="1066" y1="421" x2="1112" y2="421" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<path class="gw" d="M1152,383 L1190,421 L1152,459 L1114,421 Z"/>
<path d="M1142,411 L1162,431 M1162,411 L1142,431" stroke="#A09A2E" stroke-width="2.6" fill="none"/>
<text class="lbl" x="1152" y="370" text-anchor="middle">¿Hay repuesto?</text>
<line x1="1190" y1="421" x2="1232" y2="421" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>
<text class="lbl" x="1211" y="412" text-anchor="middle" fill="#B02A37">No</text>

<!-- evento temporizador -->
<circle cx="1256" cy="421" r="21" fill="#FFFFFF" stroke="#B02A37" stroke-width="2.6"/>
<circle cx="1256" cy="421" r="16.5" fill="#FFFFFF" stroke="#B02A37" stroke-width="2"/>
<circle cx="1256" cy="421" r="10" fill="none" stroke="#B02A37" stroke-width="1.5"/>
<path d="M1256,414 L1256,421 L1261,425" fill="none" stroke="#B02A37" stroke-width="1.7"/>
<text class="txtb" x="1256" y="464" text-anchor="middle" font-size="13">Espera compra</text>
<text class="lblb" x="1256" y="481" text-anchor="middle">sin fecha ni seguimiento</text>

<text class="lbl" x="1155" y="484" text-anchor="middle">Sí</text>
<path d="M1152,459 L1152,506 L1432,506 L1432,463" fill="none" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="task" x="1348" y="383" width="168" height="80" rx="12"/>
<text class="txt" x="1432" y="417" text-anchor="middle">Arregla</text>
<text class="lbl" x="1432" y="437" text-anchor="middle">nadie sabe qué cambió</text>
<line x1="1516" y1="421" x2="1556" y2="421" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="taskB" x="1558" y="381" width="182" height="80" rx="12"/>
<text class="txtb" x="1649" y="410" text-anchor="middle">Lo cuenta de boca</text>
<text class="lblb" x="1649" y="430" text-anchor="middle">sin causa, sin fecha,</text>
<text class="lblb" x="1649" y="446" text-anchor="middle">sin firma, sin foto</text>
<line x1="1740" y1="421" x2="1782" y2="421" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<circle cx="1804" cy="421" r="19" fill="#E8A5A5" stroke="#A02B2B" stroke-width="4"/>
<text class="lblb" x="1804" y="461" text-anchor="middle">no hay orden</text>

<!-- ============ CARRIL 3 · TERCERÍA  (cy 681) ============ -->
<circle cx="232" cy="681" r="19" fill="#FFFFFF" stroke="#5B9B47" stroke-width="2.4"/>
<text class="lbl" x="232" y="720" text-anchor="middle">Instalación nueva</text>
<line x1="251" y1="681" x2="288" y2="681" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="taskB" x="290" y="641" width="172" height="80" rx="12"/>
<text class="txtb" x="376" y="675" text-anchor="middle">Elige el sitio A OJO</text>
<text class="lblb" x="376" y="695" text-anchor="middle">sin dejar escrito por qué</text>
<line x1="462" y1="681" x2="502" y2="681" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="task" x="504" y="641" width="172" height="80" rx="12"/>
<text class="txt" x="590" y="675" text-anchor="middle">Tira el cable</text>
<text class="txt" x="590" y="693" text-anchor="middle">por donde se puede</text>
<line x1="676" y1="681" x2="716" y2="681" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="taskB" x="718" y="633" width="220" height="96" rx="12"/>
<text class="txtb" x="828" y="662" text-anchor="middle" font-size="14.5">NO MIDE LA RED</text>
<text class="lblb" x="828" y="683" text-anchor="middle">ni caudal, ni pérdida del tramo,</text>
<text class="lblb" x="828" y="699" text-anchor="middle">ni alcance del enlace,</text>
<text class="lblb" x="828" y="715" text-anchor="middle">ni canales libres del grabador</text>
<line x1="938" y1="681" x2="978" y2="681" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="taskB" x="980" y="625" width="246" height="112" rx="12"/>
<text class="txtb" x="1103" y="654" text-anchor="middle" font-size="14.5">CONFIGURA LA ANTENA</text>
<text class="txtb" x="1103" y="673" text-anchor="middle" font-size="14.5">CON **SU** CONTRASEÑA</text>
<text class="lblb" x="1103" y="694" text-anchor="middle">se la lleva al terminar el contrato</text>
<text class="lblb" x="1103" y="710" text-anchor="middle">para tocar el equipo hay que</text>
<text class="lblb" x="1103" y="726" text-anchor="middle">RESETEARLO — con el tren parado</text>
<line x1="1226" y1="681" x2="1266" y2="681" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="taskB" x="1268" y="641" width="192" height="80" rx="12"/>
<text class="txtb" x="1364" y="668" text-anchor="middle">Enlaza al grabador</text>
<text class="txtb" x="1364" y="686" text-anchor="middle">que le queda cerca</text>
<text class="lblb" x="1364" y="706" text-anchor="middle">sin criterio de tren</text>
<line x1="1460" y1="681" x2="1500" y2="681" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="task" x="1502" y="641" width="168" height="80" rx="12"/>
<text class="txt" x="1586" y="675" text-anchor="middle">Entrega y se va</text>
<text class="lbl" x="1586" y="695" text-anchor="middle">sólo queda la factura</text>
<line x1="1670" y1="681" x2="1712" y2="681" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<circle cx="1734" cy="681" r="19" fill="#E8A5A5" stroke="#A02B2B" stroke-width="4"/>
<text class="lblb" x="1780" y="721" text-anchor="middle">sin plano · sin acta · sin credenciales</text>

<!-- ============ CARRIL 4 · JEFATURA  (cy 896) ============ -->
<rect class="task" x="290" y="856" width="214" height="80" rx="12"/>
<text class="txt" x="397" y="885" text-anchor="middle">¿Cuántas cámaras hay?</text>
<text class="lblb" x="397" y="905" text-anchor="middle">«unas cuatrocientas»</text>
<line x1="504" y1="896" x2="544" y2="896" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="task" x="546" y="856" width="214" height="80" rx="12"/>
<text class="txt" x="653" y="885" text-anchor="middle">¿Cuánto tardamos?</text>
<text class="lblb" x="653" y="905" text-anchor="middle">«depende»</text>
<line x1="760" y1="896" x2="800" y2="896" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="task" x="802" y="856" width="214" height="80" rx="12"/>
<text class="txt" x="909" y="885" text-anchor="middle">¿Qué falla más?</text>
<text class="lblb" x="909" y="905" text-anchor="middle">«creo que las del horno»</text>
<line x1="1016" y1="896" x2="1056" y2="896" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="taskB" x="1058" y="848" width="278" height="96" rx="12"/>
<text class="txtb" x="1197" y="879" text-anchor="middle" font-size="15">EL PRESUPUESTO SE DECIDE</text>
<text class="txtb" x="1197" y="899" text-anchor="middle" font-size="15">POR INTUICIÓN</text>
<text class="lblb" x="1197" y="920" text-anchor="middle">y sin cifras no se aprueba nada</text>
<line x1="1336" y1="896" x2="1378" y2="896" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<circle cx="1400" cy="896" r="19" fill="#E8A5A5" stroke="#A02B2B" stroke-width="4"/>

<rect x="1452" y="848" width="410" height="96" rx="10" fill="#3A3A3A"/>
<text x="1657" y="882" text-anchor="middle" font-size="17" font-weight="700" fill="#FFFFFF">La planta no tiene un problema de cámaras.</text>
<text x="1657" y="910" text-anchor="middle" font-size="17" font-weight="700" fill="#FF9A9A">Tiene un problema de MEMORIA.</text>
<text x="1657" y="932" text-anchor="middle" font-size="12.5" fill="#C8C8C8">Lo que no está documentado, no ocurrió.</text>

