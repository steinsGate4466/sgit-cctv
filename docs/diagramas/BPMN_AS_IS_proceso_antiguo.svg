<text class="lane" transform="translate(138,896) rotate(-90)" text-anchor="middle">Jefatura</text>

<!-- ============ CARRIL 1 · PRODUCCIÓN  (cy 191) ============ -->
<circle cx="232" cy="191" r="19" fill="#FFFFFF" stroke="#5B9B47" stroke-width="2.4"/>
<text class="lbl" x="232" y="230" text-anchor="middle">No veo la cámara</text>
<line x1="251" y1="191" x2="288" y2="191" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<rect class="task" x="290" y="151" width="176" height="80" rx="12"/>
<text class="txt" x="378" y="185" text-anchor="middle">Detecta que una</text>
<text class="txt" x="378" y="203" text-anchor="middle">cámara no da imagen</text>
<line x1="466" y1="191" x2="506" y2="191" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<!-- evento de mensaje: aviso por radio -->
<circle cx="530" cy="191" r="21" fill="#FFFFFF" stroke="#B02A37" stroke-width="2.6"/>
<circle cx="530" cy="191" r="16.5" fill="#FFFFFF" stroke="#B02A37" stroke-width="2"/>
<rect x="521" y="185" width="18" height="12" fill="none" stroke="#B02A37" stroke-width="1.6"/>
<path d="M521,185 L530,193 L539,185" fill="none" stroke="#B02A37" stroke-width="1.6"/>
<text class="txtb" x="530" y="234" text-anchor="middle" font-size="13">AVISA POR RADIO</text>
<text class="lblb" x="530" y="251" text-anchor="middle">no queda registro</text>
<line x1="551" y1="191" x2="600" y2="191" stroke="#000" stroke-width="1.6" marker-end="url(#a)"/>

<path class="gw" d="M640,153 L678,191 L640,229 L602,191 Z"/>
<path d="M630,181 L650,201 M650,181 L630,201" stroke="#A09A2E" stroke-width="2.6" fill="none"/>
