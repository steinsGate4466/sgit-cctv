<rect width="1920" height="1080" fill="#FFFFFF"/>

<!-- ===== CABECERA ===== -->
<text x="46" y="44" font-size="26" font-weight="700" fill="#1A1A1A">Proceso ACTUAL (AS-IS) — gestión de CCTV sin sistema</text>
<text x="46" y="70" font-size="15" fill="#6A6A6A">Aceros Arequipa · Planta Pisco · LAMINACIÓN (Trenes 1, 2 y 3)</text>
<rect x="1560" y="24" width="314" height="50" rx="6" fill="#F8D7DA" stroke="#B02A37" stroke-width="2"/>
<text x="1717" y="45" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7B1620">Todo lo marcado en ROJO</text>
<text x="1717" y="63" text-anchor="middle" font-size="13.5" font-weight="700" fill="#7B1620">se pierde y no se recupera</text>

<!-- ===== PISCINA ===== -->
<rect x="40" y="96" width="1840" height="890" fill="none" stroke="#8A8A8A" stroke-width="2"/>
