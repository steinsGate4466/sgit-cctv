    <path d="M0,0 L10,5 L0,10 z" fill="#000000"/>
  </marker>
  <marker id="ao" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/>
  </marker>
  <style>
