<circle cx="740" cy="1013" r="8" fill="#FFFFFF" stroke="#A09A2E" stroke-width="1.8"/>
<text x="758" y="1019" font-size="13" fill="#3A3A3A">Evento intermedio (mensaje / temporizador)</text>
<circle cx="1090" cy="1013" r="11" fill="#FFFFFF" stroke="#5B9B47" stroke-width="2.2"/>
<text x="1108" y="1019" font-size="13" fill="#3A3A3A">Inicio</text>
<circle cx="1180" cy="1013" r="11" fill="#E8A5A5" stroke="#A02B2B" stroke-width="3.4"/>
<text x="1198" y="1019" font-size="13" fill="#3A3A3A">Fin — sin registro ni trazabilidad</text>
<text x="1874" y="1019" font-size="12.5" fill="#8A8A8A" text-anchor="end">SGIT-CCTV · BPMN del proceso ACTUAL (AS-IS)</text>
