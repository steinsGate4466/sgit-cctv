<text x="790.0" y="36.0" font-size="17" fill="#1F3348" font-weight="bold" text-anchor="middle">PROCESO DE AMPLIACIÓN — Instalación de nuevos equipos acoplada a las ventanas de parada</text><text x="790.0" y="59.2" font-size="12" fill="#6B7480" font-weight="normal" text-anchor="middle">La ampliación de cobertura deja de ser una obra improvisada y pasa a ser un proyecto planificado sobre evidencia de campo</text><rect x="36" y="80" width="1210" height="770" fill="none" stroke="#9AA4B0" stroke-width="1.4"/><rect x="36" y="80" width="30" height="770" fill="#F2F2F2" stroke="#9AA4B0" stroke-width="1.4"/><text x="51" y="465.0" font-size="13" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 51 465.0)">AMPLIACIÓN DE COBERTURA CCTV</text><rect x="66" y="80" width="1180" height="150" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="80" width="28" height="150" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="155.0" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 155.0)">Producción</text><rect x="66" y="230" width="1180" height="165" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="230" width="28" height="165" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="312.5" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 312.5)">Jefe de Mantenimiento</text><rect x="66" y="395" width="1180" height="175" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="395" width="28" height="175" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="482.5" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 482.5)">Técnico evaluador</text><rect x="66" y="570" width="1180" height="150" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="570" width="28" height="150" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="645.0" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 645.0)">Cuadrilla</text><rect x="66" y="720" width="1180" height="130" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="720" width="28" height="130" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="785.0" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 785.0)">SGIT-CCTV (sistema)</text><circle cx="130" cy="155.0" r="17" fill="url(#gIni)" stroke="#5FA544" stroke-width="1.8"/><rect x="206.0" y="128.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="265" y="139.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Solicita</text><text x="265" y="152.3" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">cobertura para</text><text x="265" y="165.1" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">una zona sin</text><text x="265" y="177.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">vista</text><rect x="386.0" y="285.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="445" y="303.4" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Evalúa la</text><text x="445" y="316.2" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">solicitud y</text><text x="445" y="329.0" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">asigna evaluador</text><rect x="566.0" y="455.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="625" y="467.0" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Visita el sitio</text><text x="625" y="479.8" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">y mide</text><text x="625" y="492.6" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">condiciones</text><text x="625" y="505.4" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">reales</text><rect x="746.0" y="455.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="805" y="473.4" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Registra altura,</text><text x="805" y="486.2" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">acceso, energía</text><text x="805" y="499.0" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">y distancia</text><path d="M960,287.5 L985,312.5 L960,337.5 L935,312.5 z" fill="url(#gGw)" stroke="#C9A227" stroke-width="1.5"/><text x="960" y="317.0" font-size="15" fill="#C9A227" text-anchor="middle">&#215;</text><text x="960" y="370.8" font-size="9.5" fill="#1F3348" font-weight="normal" text-anchor="middle">¿Aprobada?</text><rect x="901.0" y="128.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#B02418" stroke-width="1.5"/><text x="960" y="145.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Se archiva con</text><text x="960" y="158.7" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">el motivo del</text><text x="960" y="171.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">rechazo</text><rect x="1061.0" y="285.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="1120" y="303.4" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Aprueba y abre</text><text x="1120" y="316.2" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">la orden de</text><text x="1120" y="329.0" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">trabajo</text><rect x="1061.0" y="618.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="1120" y="635.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Ejecuta la</text><text x="1120" y="648.7" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">instalación en</text><text x="1120" y="661.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">la ventana</text><circle cx="1265" cy="312.5" r="17" fill="url(#gFin)" stroke="#B02418" stroke-width="3.4"/><rect x="199.0" y="762.0" width="132" height="46" rx="9" ry="9" fill="url(#gTask)" stroke="#5FA544" stroke-width="1.5"/><text x="265" y="776.3" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">Registra la</text><text x="265" y="788.5" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">solicitud con zona</text><text x="265" y="800.7" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">y motivo</text><rect x="559.0" y="762.0" width="132" height="46" rx="9" ry="9" fill="url(#gTask)" stroke="#5FA544" stroke-width="1.5"/><text x="625" y="776.3" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">Exige el perfil de</text><text x="625" y="788.5" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">datos del tipo de</text><text x="625" y="800.7" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">sitio</text><rect x="894.0" y="762.0" width="132" height="46" rx="9" ry="9" fill="url(#gTask)" stroke="#5FA544" stroke-width="1.5"/><text x="960" y="776.3" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">Cruza la orden con</text><text x="960" y="788.5" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">la próxima ventana</text><text x="960" y="800.7" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">de parada</text><rect x="1199.0" y="762.0" width="132" height="46" rx="9" ry="9" fill="url(#gTask)" stroke="#5FA544" stroke-width="1.5"/><text x="1265" y="776.3" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">Crea el activo y lo</text><text x="1265" y="788.5" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">incorpora al plan</text><text x="1265" y="800.7" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">preventivo</text><path d="M147,155.0 L206,155.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M324,155.0 L380,155.0 L380,312.5 L386,312.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M504,312.5 L560,312.5 L560,482.5 L566,482.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M684,482.5 L746,482.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M864,482.5 L960,482.5 L960,337.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M960,287.5 L960,182.0" fill="none" stroke="#B02418" stroke-width="1.4" marker-end="url(#flr)"/><rect x="975.6" y="197.0" width="18.8" height="14" fill="#FFFFFF" opacity="0.92"/><text x="985" y="208.0" font-size="9.5" fill="#B02418" text-anchor="middle">No</text><path d="M985,312.5 L1061,312.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><rect x="1010.6" y="296.5" width="18.8" height="14" fill="#FFFFFF" opacity="0.92"/><text x="1020" y="307.5" font-size="9.5" fill="#2B2B2B" text-anchor="middle">Sí</text><path d="M1120,339.5 L1120,618.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M1179,645.0 L1265,645.0 L1265,329.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M265,182.0 L265,736.0 L265,762.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)" stroke-dasharray="5,3"/><path d="M805,509.5 L805,736.0 L660,762.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)" stroke-dasharray="5,3"/><path d="M1120,339.5 L1120,736.0 L985,762.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)" stroke-dasharray="5,3"/><path d="M1265,645.0 L1265,736.0 L1265,762.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)" stroke-dasharray="5,3"/><rect x="1300" y="80" width="244" height="290" rx="6" fill="#EDF4FC" stroke="#1B5E9E" stroke-width="1.3"/><text x="1312" y="99" font-size="11.5" font-weight="bold" fill="#1B5E9E">REGLAS QUE LO SOSTIENEN</text><text x="1312" y="118" font-size="10" fill="#1F3348">• No se aprueba una instalación sin</text><text x="1312" y="132" font-size="10" fill="#1F3348">   visita previa: aprobar sin medir es</text><text x="1312" y="146" font-size="10" fill="#1F3348">   comprometer material sin conocer el</text><text x="1312" y="160" font-size="10" fill="#1F3348">   alcance.</text><text x="1312" y="177" font-size="10" fill="#1F3348">• El formulario cambia según el tipo</text><text x="1312" y="191" font-size="10" fill="#1F3348">   de sitio; los campos obligatorios</text><text x="1312" y="205" font-size="10" fill="#1F3348">   los define un único catálogo.</text><text x="1312" y="222" font-size="10" fill="#1F3348">• Al cerrar la visita nace el activo</text><text x="1312" y="236" font-size="10" fill="#1F3348">   dentro de la misma transacción.</text><rect x="1300" y="386" width="244" height="290" rx="6" fill="#EFF8EC" stroke="#2E7D32" stroke-width="1.3"/><text x="1312" y="405" font-size="11.5" font-weight="bold" fill="#2E7D32">ACOPLE A LA PARADA DE TREN</text><text x="1312" y="424" font-size="10" fill="#1F3348">• Toda orden puede ligarse a una</text><text x="1312" y="438" font-size="10" fill="#1F3348">   ventana de parada declarada por</text><text x="1312" y="452" font-size="10" fill="#1F3348">   Producción.</text><text x="1312" y="469" font-size="10" fill="#1F3348">• Las zonas que exigen línea detenida</text><text x="1312" y="483" font-size="10" fill="#1F3348">   no se programan fuera de ventana.</text><text x="1312" y="500" font-size="10" fill="#1F3348">• Cada movimiento de la ventana queda</text><text x="1312" y="514" font-size="10" fill="#1F3348">   registrado con motivo obligatorio.</text><text x="40" y="895.5" font-size="10" fill="#6B7480" font-weight="normal" text-anchor="start">Notación BPMN 2.0 (Bizagi Modeler). Los ocho estados del expediente de instalación son los que gestiona el sistema: SOLICITADA · EN EVALUACIÓN · EVALUADA · APROBADA · RECHAZADA · EN EJECUCIÓN · INSTALADA · CANCELADA.</text></svg>