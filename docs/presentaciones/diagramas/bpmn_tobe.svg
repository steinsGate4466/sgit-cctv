<rect width="1580" height="940" fill="#FFFFFF"/>
<text x="790.0" y="36.0" font-size="17" fill="#1F3348" font-weight="bold" text-anchor="middle">PROCESO PROPUESTO (TO-BE) — Con SGIT-CCTV · Laminación, Planta Pisco</text><text x="790.0" y="59.2" font-size="12" fill="#6B7480" font-weight="normal" text-anchor="middle">Cada paso deja evidencia documental firmada, con nombre, hora y trazabilidad completa</text><rect x="36" y="80" width="1210" height="755" fill="none" stroke="#9AA4B0" stroke-width="1.4"/><rect x="36" y="80" width="30" height="755" fill="#F2F2F2" stroke="#9AA4B0" stroke-width="1.4"/><text x="51" y="457.5" font-size="13" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 51 457.5)">ATENCIÓN DE UNA FALLA — CON SGIT-CCTV</text><rect x="66" y="80" width="1180" height="150" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="80" width="28" height="150" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="155.0" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 155.0)">Operador de Púlpito</text><rect x="66" y="230" width="1180" height="155" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="230" width="28" height="155" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="307.5" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 307.5)">Jefe de Tren</text><rect x="66" y="385" width="1180" height="165" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="385" width="28" height="165" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="467.5" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 467.5)">Jefe de Mantenimiento</text><rect x="66" y="550" width="1180" height="155" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="550" width="28" height="155" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="627.5" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 627.5)">Técnico / Tercería</text><rect x="66" y="705" width="1180" height="130" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="705" width="28" height="130" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="770.0" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 770.0)">SGIT-CCTV (sistema)</text><circle cx="130" cy="155.0" r="17" fill="url(#gIni)" stroke="#5FA544" stroke-width="1.8"/><rect x="201.0" y="128.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="260" y="139.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Escanea el QR</text><text x="260" y="152.3" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">del equipo o</text><text x="260" y="165.1" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">pulsa "Reportar</text><text x="260" y="177.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">caída"</text><rect x="371.0" y="128.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="430" y="145.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Un solo botón:</text><text x="430" y="158.7" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">la incidencia</text><text x="430" y="171.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">queda registrada</text><rect x="371.0" y="280.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="430" y="304.8" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Ve la incidencia</text><text x="430" y="317.6" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">en Mi bandeja</text><rect x="541.0" y="280.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="600" y="292.0" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Abre la OM</text><text x="600" y="304.8" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">(wo.create) y la</text><text x="600" y="317.6" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">ata a la</text><text x="600" y="330.4" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">incidencia</text><rect x="541.0" y="440.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="600" y="452.0" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Asigna al</text><text x="600" y="464.8" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">técnico y</text><text x="600" y="477.6" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">programa la</text><text x="600" y="490.4" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">fecha</text><rect x="731.0" y="600.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="790" y="618.4" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Escanea el QR,</text><text x="790" y="631.2" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">arranca la OM y</text><text x="790" y="644.0" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">registra avances</text><rect x="901.0" y="600.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="960" y="624.8" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Sube fotos y</text><text x="960" y="637.6" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">firma su parte</text><path d="M1105,442.5 L1130,467.5 L1105,492.5 L1080,467.5 z" fill="url(#gGw)" stroke="#C9A227" stroke-width="1.5"/><text x="1105" y="472.0" font-size="15" fill="#C9A227" text-anchor="middle">&#215;</text><text x="1105" y="525.8" font-size="9.5" fill="#1F3348" font-weight="normal" text-anchor="middle">¿Trabajo conforme?</text><rect x="901.0" y="440.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="960" y="458.4" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Cierra la OM con</text><text x="960" y="471.2" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">FIRMA</text><text x="960" y="484.0" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">(wo.approve)</text><circle cx="1215" cy="467.5" r="17" fill="url(#gFin)" stroke="#B02418" stroke-width="3.4"/><rect x="235.0" y="747.0" width="130" height="46" rx="9" ry="9" fill="url(#gTask)" stroke="#5FA544" stroke-width="1.5"/><text x="300" y="767.4" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">Sella hora exacta,</text><text x="300" y="779.6" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">autor, IP y equipo</text><rect x="535.0" y="747.0" width="130" height="46" rx="9" ry="9" fill="url(#gTask)" stroke="#5FA544" stroke-width="1.5"/><text x="600" y="767.4" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">Genera código OM y</text><text x="600" y="779.6" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">guarda en auditoría</text><rect x="835.0" y="747.0" width="130" height="46" rx="9" ry="9" fill="url(#gTask)" stroke="#5FA544" stroke-width="1.5"/><text x="900" y="761.3" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">Calcula MTTR,</text><text x="900" y="773.5" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">backlog y</text><text x="900" y="785.7" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">cumplimiento</text><rect x="1075.0" y="747.0" width="130" height="46" rx="9" ry="9" fill="url(#gTask)" stroke="#5FA544" stroke-width="1.5"/><text x="1140" y="767.4" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">Informe PDF firmado</text><text x="1140" y="779.6" font-size="10" fill="#1F3348" font-weight="normal" text-anchor="middle">y Excel</text><path d="M147,155.0 L200,155.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M319,155.0 L371,155.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M430,182.0 L430,280.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M489,307.5 L541,307.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M600,334.5 L600,440.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M659,467.5 L720,467.5 L720,627.5 L730,627.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M849,627.5 L901,627.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M1019,627.5 L1105,627.5 L1105,492.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M1105,442.5 L1105,423.5 L960,423.5 L960,440.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><rect x="1020.6" y="409.5" width="18.8" height="14" fill="#FFFFFF" opacity="0.92"/><text x="1030" y="420.5" font-size="9.5" fill="#2B2B2B" text-anchor="middle">Sí</text><path d="M1130,467.5 L1198,467.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M1105,492.5 L1105,679.5 L790,679.5 L790,654.5" fill="none" stroke="#B02418" stroke-width="1.4" marker-end="url(#flr)"/><rect x="869.4" y="683.5" width="121.2" height="14" fill="#FFFFFF" opacity="0.92"/><text x="930" y="694.5" font-size="9.5" fill="#B02418" text-anchor="middle">No: vuelve a campo</text><path d="M430,182.0 L430,721.0 L300,747.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)" stroke-dasharray="5,3"/><path d="M600,334.5 L600,721.0 L600,747.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)" stroke-dasharray="5,3"/><path d="M960,650.5 L960,721.0 L900,747.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)" stroke-dasharray="5,3"/><path d="M1215,484.5 L1215,721.0 L1140,747.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)" stroke-dasharray="5,3"/><rect x="1300" y="80" width="244" height="300" rx="6" fill="#EFF8EC" stroke="#2E7D32" stroke-width="1.3"/><text x="1312" y="99" font-size="11.5" font-weight="bold" fill="#2E7D32">LO QUE AHORA SÍ QUEDA</text><text x="1312" y="118" font-size="10" fill="#1F3348">• Toda incidencia queda registrada</text><text x="1312" y="132" font-size="10" fill="#1F3348">   aunque nadie la atienda: no se</text><text x="1312" y="146" font-size="10" fill="#1F3348">   pierde ninguna.</text><text x="1312" y="163" font-size="10" fill="#1F3348">• Hora de caída, de reporte y de</text><text x="1312" y="177" font-size="10" fill="#1F3348">   reparación separadas: el MTTR es</text><text x="1312" y="191" font-size="10" fill="#1F3348">   real.</text><text x="1312" y="208" font-size="10" fill="#1F3348">• Síntoma, causa y acción salen de</text><text x="1312" y="222" font-size="10" fill="#1F3348">   catálogo: se pueden CONTAR.</text><text x="1312" y="239" font-size="10" fill="#1F3348">• Informe PDF firmado, buscable y</text><text x="1312" y="253" font-size="10" fill="#1F3348">   exportable a Excel.</text><rect x="1300" y="396" width="244" height="300" rx="6" fill="#EDF4FC" stroke="#1B5E9E" stroke-width="1.3"/><text x="1312" y="415" font-size="11.5" font-weight="bold" fill="#1B5E9E">LO QUE GANA JEFATURA</text><text x="1312" y="434" font-size="10" fill="#1F3348">• Evidencia documental ante</text><text x="1312" y="448" font-size="10" fill="#1F3348">   auditoría, con firma y hora.</text><text x="1312" y="465" font-size="10" fill="#1F3348">• Se sabe qué equipo falla más: el</text><text x="1312" y="479" font-size="10" fill="#1F3348">   presupuesto se sustenta con datos.</text><text x="1312" y="496" font-size="10" fill="#1F3348">• Preventivo programado por</text><text x="1312" y="510" font-size="10" fill="#1F3348">   criticidad A/B/C: se deja de apagar</text><text x="1312" y="524" font-size="10" fill="#1F3348">   incendios.</text><text x="1312" y="541" font-size="10" fill="#1F3348">• El conocimiento queda en el</text><text x="1312" y="555" font-size="10" fill="#1F3348">   sistema, no en la cabeza del</text><text x="1312" y="569" font-size="10" fill="#1F3348">   técnico.</text><text x="40" y="880.5" font-size="10" fill="#6B7480" font-weight="normal" text-anchor="start">Notación BPMN 2.0 (Bizagi Modeler) — la calle inferior representa al sistema; las flechas discontinuas son el registro automático de evidencia.</text></svg>