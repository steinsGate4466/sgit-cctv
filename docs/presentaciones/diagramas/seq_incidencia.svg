<text x="770.0" y="36.3" font-size="18" fill="#101010" font-weight="bold" text-anchor="middle">DIAGRAMA DE SECUENCIA — De la caída de una cámara al informe firmado</text><text x="770.0" y="58.0" font-size="11.5" fill="#5A6570" font-weight="normal" text-anchor="middle">Recorrido real de una petición por las capas del sistema, con los guardas de seguridad en su orden exacto</text><g stroke="#000000" stroke-width="1.6" fill="none"><circle cx="95" cy="92.8" r="5.6000000000000005"/><line x1="95" y1="98.4" x2="95" y2="115.2"/><line x1="84.6" y1="104.8" x2="105.4" y2="104.8"/><line x1="95" y1="115.2" x2="86.2" y2="129.6"/><line x1="95" y1="115.2" x2="103.8" y2="129.6"/></g><text x="95" y="145.9" font-size="10" fill="#101010" font-weight="normal" text-anchor="middle">Operador de Púlpito</text><line x1="95" y1="152" x2="95" y2="930" stroke="#000000" stroke-width="1" stroke-dasharray="6,5"/><rect x="184.0" y="90" width="142" height="40" fill="#EAF1FA" stroke="#000000" stroke-width="1.4"/><text x="255" y="107.2" font-size="10.5" fill="#101010" font-weight="bold" text-anchor="middle">Pantalla</text><text x="255" y="120.2" font-size="10.5" fill="#101010" font-weight="bold" text-anchor="middle">ReportarCaída</text><line x1="255" y1="152" x2="255" y2="930" stroke="#000000" stroke-width="1" stroke-dasharray="6,5"/><rect x="359.0" y="90" width="142" height="40" fill="#EAF1FA" stroke="#000000" stroke-width="1.4"/><text x="430" y="107.2" font-size="10.5" fill="#101010" font-weight="bold" text-anchor="middle">API REST</text><text x="430" y="120.2" font-size="10.5" fill="#101010" font-weight="bold" text-anchor="middle">(NestJS)</text><line x1="430" y1="152" x2="430" y2="930" stroke="#000000" stroke-width="1" stroke-dasharray="6,5"/><rect x="529.0" y="90" width="142" height="40" fill="#EAF1FA" stroke="#000000" stroke-width="1.4"/><text x="600" y="107.2" font-size="10.5" fill="#101010" font-weight="bold" text-anchor="middle">Cadena de</text><text x="600" y="120.2" font-size="10.5" fill="#101010" font-weight="bold" text-anchor="middle">Guardas</text><line x1="600" y1="152" x2="600" y2="930" stroke="#000000" stroke-width="1" stroke-dasharray="6,5"/><rect x="709.0" y="90" width="142" height="40" fill="#EAF1FA" stroke="#000000" stroke-width="1.4"/><text x="780" y="113.7" font-size="10.5" fill="#101010" font-weight="bold" text-anchor="middle">IncidentsService</text><line x1="780" y1="152" x2="780" y2="930" stroke="#000000" stroke-width="1" stroke-dasharray="6,5"/><rect x="889.0" y="90" width="142" height="40" fill="#EAF1FA" stroke="#000000" stroke-width="1.4"/><text x="960" y="107.2" font-size="10.5" fill="#101010" font-weight="bold" text-anchor="middle">PostgreSQL</text><text x="960" y="120.2" font-size="10.5" fill="#101010" font-weight="bold" text-anchor="middle">(Prisma)</text><line x1="960" y1="152" x2="960" y2="930" stroke="#000000" stroke-width="1" stroke-dasharray="6,5"/><rect x="1059.0" y="90" width="142" height="40" fill="#EAF1FA" stroke="#000000" stroke-width="1.4"/><text x="1130" y="113.7" font-size="10.5" fill="#101010" font-weight="bold" text-anchor="middle">AuditService</text><line x1="1130" y1="152" x2="1130" y2="930" stroke="#000000" stroke-width="1" stroke-dasharray="6,5"/><rect x="1239.0" y="90" width="142" height="40" fill="#EAF1FA" stroke="#000000" stroke-width="1.4"/><text x="1310" y="107.2" font-size="10.5" fill="#101010" font-weight="bold" text-anchor="middle">MinIO</text><text x="1310" y="120.2" font-size="10.5" fill="#101010" font-weight="bold" text-anchor="middle">(fotos/PDF)</text><line x1="1310" y1="152" x2="1310" y2="930" stroke="#000000" stroke-width="1" stroke-dasharray="6,5"/><g stroke="#000000" stroke-width="1.6" fill="none"><circle cx="1450" cy="92.8" r="5.6000000000000005"/><line x1="1450" y1="98.4" x2="1450" y2="115.2"/><line x1="1439.6" y1="104.8" x2="1460.4" y2="104.8"/><line x1="1450" y1="115.2" x2="1441.2" y2="129.6"/><line x1="1450" y1="115.2" x2="1458.8" y2="129.6"/></g><text x="1450" y="145.9" font-size="10" fill="#101010" font-weight="normal" text-anchor="middle">Jefe de Mantenimiento</text><line x1="1450" y1="152" x2="1450" y2="930" stroke="#000000" stroke-width="1" stroke-dasharray="6,5"/><rect x="249.5" y="195" width="11" height="660" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><rect x="424.5" y="225" width="11" height="600" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><rect x="594.5" y="250" width="11" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><rect x="774.5" y="400" width="11" height="420" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><rect x="954.5" y="440" width="11" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><rect x="1124.5" y="620" width="11" height="50" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><rect x="1304.5" y="520" width="11" height="60" fill="#FFFFFF" stroke="#000000" stroke-width="1.2"/><line x1="101" y1="195" x2="249" y2="195" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="96.0" y="179" width="158.0" height="14" fill="#FFFFFF"/><text x="175.0" y="190" font-size="10" text-anchor="middle" fill="#101010">1: pulsa «Reportar caída»</text><line x1="261" y1="225" x2="424" y2="225" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="209.5" y="209" width="266.0" height="14" fill="#FFFFFF"/><text x="342.5" y="220" font-size="10" text-anchor="middle" fill="#101010">2: POST /incidents/reporte/{assetId} + foto</text><line x1="436" y1="258" x2="594" y2="258" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="457.0" y="242" width="116.0" height="14" fill="#FFFFFF"/><text x="515.0" y="253" font-size="10" text-anchor="middle" fill="#101010">3: valida petición</text><path d="M606,275 L652,275 L652,301 L608,301" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><text x="660" y="291" font-size="10" fill="#101010">3.1  RitmoGuard — límite de peticiones</text><path d="M606,305 L652,305 L652,331 L608,331" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><text x="660" y="321" font-size="10" fill="#101010">3.2  JwtAuthGuard — ¿quién eres?</text><path d="M606,332 L652,332 L652,358 L608,358" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><text x="660" y="348" font-size="10" fill="#101010">3.3  AccesoVigenteGuard — ¿tu token sigue vivo?</text><line x1="594" y1="372" x2="436" y2="372" stroke="#000000" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#ap)"/><rect x="418.0" y="356" width="194.0" height="14" fill="#FFFFFF"/><text x="515.0" y="367" font-size="10" text-anchor="middle" fill="#101010">4: autorizado (incident.create)</text><line x1="436" y1="400" x2="774" y2="400" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="454.0" y="384" width="302.0" height="14" fill="#FFFFFF"/><text x="605.0" y="395" font-size="10" text-anchor="middle" fill="#101010">5: reportarDesdeProduccion(assetId, userId, foto)</text><line x1="786" y1="440" x2="954" y2="440" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="749.0" y="424" width="242.0" height="14" fill="#FFFFFF"/><text x="870.0" y="435" font-size="10" text-anchor="middle" fill="#101010">6: crea Incident (código INC-AAAA-NNNN)</text><line x1="954" y1="478" x2="786" y2="478" stroke="#000000" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#ap)"/><rect x="818.0" y="462" width="104.0" height="14" fill="#FFFFFF"/><text x="870.0" y="473" font-size="10" text-anchor="middle" fill="#101010">7: INC-2026-0005</text><line x1="786" y1="520" x2="1304" y2="520" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="933.0" y="504" width="224.0" height="14" fill="#FFFFFF"/><text x="1045.0" y="515" font-size="10" text-anchor="middle" fill="#101010">8: guarda la fotografía de evidencia</text><line x1="1304" y1="558" x2="786" y2="558" stroke="#000000" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#ap)"/><rect x="990.0" y="542" width="110.0" height="14" fill="#FFFFFF"/><text x="1045.0" y="553" font-size="10" text-anchor="middle" fill="#101010">9: URL del objeto</text><line x1="786" y1="600" x2="954" y2="600" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="755.0" y="584" width="230.0" height="14" fill="#FFFFFF"/><text x="870.0" y="595" font-size="10" text-anchor="middle" fill="#101010">10: crea FailureEvent (hora de caída)</text><line x1="436" y1="640" x2="1124" y2="640" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="656.0" y="624" width="248.0" height="14" fill="#FFFFFF"/><text x="780.0" y="635" font-size="10" text-anchor="middle" fill="#101010">11: registra quién, cuándo y desde dónde</text><line x1="424" y1="680" x2="261" y2="680" stroke="#000000" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#ap)"/><rect x="245.5" y="664" width="194.0" height="14" fill="#FFFFFF"/><text x="342.5" y="675" font-size="10" text-anchor="middle" fill="#101010">12: 201 Created · INC-2026-0005</text><line x1="249" y1="712" x2="101" y2="712" stroke="#000000" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#ap)"/><rect x="27.0" y="696" width="296.0" height="14" fill="#FFFFFF"/><text x="175.0" y="707" font-size="10" text-anchor="middle" fill="#101010">13: «Registrada. El Jefe ya la ve en su bandeja»</text><line x1="1444" y1="770" x2="261" y2="770" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="737.5" y="754" width="230.0" height="14" fill="#FFFFFF"/><text x="852.5" y="765" font-size="10" text-anchor="middle" fill="#101010">14: abre Mi bandeja y convierte en OM</text><line x1="261" y1="805" x2="424" y2="805" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="239.5" y="789" width="206.0" height="14" fill="#FFFFFF"/><text x="342.5" y="800" font-size="10" text-anchor="middle" fill="#101010">15: POST /work-orders (wo.create)</text><line x1="436" y1="840" x2="954" y2="840" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="568.0" y="824" width="254.0" height="14" fill="#FFFFFF"/><text x="695.0" y="835" font-size="10" text-anchor="middle" fill="#101010">16: crea WorkOrder ligada a la incidencia</text><line x1="436" y1="878" x2="1304" y2="878" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="767.0" y="862" width="206.0" height="14" fill="#FFFFFF"/><text x="870.0" y="873" font-size="10" text-anchor="middle" fill="#101010">17: informe PDF firmado al cerrar</text><rect x="60" y="742" width="1400" height="1" fill="none" stroke="#000000" stroke-dasharray="3,3"/><text x="300" y="738.3" font-size="9.5" fill="#5A6570" font-weight="normal" text-anchor="middle" font-style="italic">— continuación: el Jefe convierte la incidencia en orden de trabajo —</text><text x="770.0" y="985.7" font-size="10.5" fill="#5A6570" font-weight="normal" text-anchor="middle">Notación UML 2.5 (StarUML) — líneas de vida, barras de activación, mensajes síncronos y de retorno.</text></svg>