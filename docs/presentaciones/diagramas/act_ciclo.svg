al" text-anchor="middle">Se documenta y se</text><text x="720" y="184.9" font-size="10.3" fill="#101010" font-weight="normal" text-anchor="middle">cierra sin OM</text><rect x="804.0" y="344.0" width="132" height="52" rx="10" fill="#EAF1FA" stroke="#000000" stroke-width="1.4"/><text x="870" y="367.3" font-size="10.3" fill="#101010" font-weight="normal" text-anchor="middle">Abre la OM y la</text><text x="870" y="379.9" font-size="10.3" fill="#101010" font-weight="normal" text-anchor="middle">asigna</text><rect x="804.0" y="759.0" width="132" height="52" rx="10" fill="#EAF7E4" stroke="#000000" stroke-width="1.4"/><text x="870" y="776.0" font-size="10.3" fill="#101010" font-weight="normal" text-anchor="middle">Genera código OM y</text><text x="870" y="788.6" font-size="10.3" fill="#101010" font-weight="normal" text-anchor="middle">liga a la</text><text x="870" y="801.2" font-size="10.3" fill="#101010" font-weight="normal" text-anchor="middle">incidencia</text><rect x="964.0" y="554.0" width="132" height="52" rx="10" fill="#EAF1FA" stroke="#000000" stroke-width="1.4"/><text x="1030" y="577.3" font-size="10.3" fill="#101010" font-weight="normal" text-anchor="middle">Escanea el QR y</text><text x="1030" y="589.9" font-size="10.3" fill="#101010" font-weight="normal" text-anchor="middle">arranca la OM</text><rect x="1114.0" y="554.0" width="132" height="52" rx="10" fill="#EAF1FA" stroke="#000000" stroke-width="1.4"/><text x="1180" y="571.0" font-size="10.3" fill="#101010" font-weight="normal" text-anchor="middle">Registra avance:</text><text x="1180" y="583.6" font-size="10.3" fill="#101010" font-weight="normal" text-anchor="middle">síntoma, causa,</text><text x="1180" y="596.2" font-size="10.3" fill="#101010" font-weight="normal" text-anchor="middle">acción</text><rect x="1114.0" y="759.0" width="132" height="52" rx="10" fill="#EAF7E4" stroke="#000000" stroke-width="1.4"/><text x="1180" y="776.0" font-size="10.3" fill="#101010" font-weight="normal" text-anchor="middle">Calc