<rect width="1440" height="880" fill="#FFFFFF"/>
<text x="720.0" y="36.3" font-size="18" fill="#101010" font-weight="bold" text-anchor="middle">DIAGRAMA DE ESTADOS — Ciclo de vida de una Orden de Mantenimiento</text><text x="720.0" y="58.0" font-size="11.5" fill="#5A6570" font-weight="normal" text-anchor="middle">Las transiciones y sus guardas son las que aplica de verdad el servicio: ningún salto está permitido sin su permiso</text><circle cx="90" cy="180" r="12" fill="#000000"/><rect x="185.0" y="145.0" width="190" height="70" rx="14" fill="#EAF1FA" stroke="#000000" stroke-width="1.5"/><text x="280" y="166.0" font-size="11.5" fill="#101010" font-weight="bold" text-anchor="middle">SIN DETALLAR</text><line x1="185.0" y1="173.0" x2="375.0" y2="173.0" stroke="#000000" stroke-width="1"/><text x="193.0" y="189.0" font-size="9.5">entry / código OM-AAAA-NNNN</text><text x="193.0" y="204.0" font-size="9.5">entry / fecha = HOY, nunca vacía</text><rect x="525.0" y="145.0" width="190" height="70" rx="14" fill="#EAF1FA" stroke="#000000" stroke-width="1.5"/><text x="620" y="166.0" font-size="11.5" fill="#101010" font-weight="bold" text-anchor="middle">ABIERTA</text><line x1="525.0" y1="173.0" x2="715.0" y2="173.0" stroke="#000000" stroke-width="1"/><text x="533.0" y="189.0" font-size="9.5">do / esperando al técnico</text><text x="533.0" y="204.0" font-size="9.5">permiso: wo.update para detallar</text><rect x="525.0" y="357.5" width="190" height="85" rx="14" fill="#EAF1FA" stroke="#000000" stroke-width="1.5"/><text x="620" y="378.5" font-size="11.5" fill="#101010" font-weight="bold" text-anchor="middle">EN PROCESO</text><line x1="525.0" y1="385.5" x2="715.0" y2="385.5" stroke="#000000" stroke-width="1"/><text x="533.0" y="401.5" font-size="9.5">entry / startedAt + firma</text><text x="533.0" y="416.5" font-size="9.5">do / registrar avances con</text><text x="533.0" y="431.5" font-size="9.5">        síntoma, causa y acción</text><rect x="935.0" y="365.0" width="190" height="70" rx="14" fill="#EAF1FA" stroke="#000000" stroke-width="1.5"/><text x="1030" y="386.0" font-size="11.5" fill="#101010" font-weight="bold" text-anchor="middle">EN ESPERA</text><line x1="935.0" y1="393.0" x2="1125.0" y2="393.0" stroke="#000000" stroke-width="1"/><text x="943.0" y="409.0" font-size="9.5">do / falta repuesto o</text><text x="943.0" y="424.0" font-size="9.5">        ventana de parada</text><rect x="520.0" y="607.5" width="200" height="85" rx="14" fill="#EAF7E4" stroke="#000000" stroke-width="1.5"/><text x="620" y="628.5" font-size="11.5" fill="#101010" font-weight="bold" text-anchor="middle">CERRADA</text><line x1="520.0" y1="635.5" x2="720.0" y2="635.5" stroke="#000000" stroke-width="1"/><text x="528.0" y="651.5" font-size="9.5">entry / closedAt + firma</text><text x="528.0" y="666.5" font-size="9.5">entry / informe PDF emitido</text><text x="528.0" y="681.5" font-size="9.5">entry / MTTR calculado</text><rect x="935.0" y="622.5" width="190" height="55" rx="14" fill="#FBE9E7" stroke="#000000" stroke-width="1.5"/><text x="1030" y="643.5" font-size="11.5" fill="#101010" font-weight="bold" text-anchor="middle">CANCELADA</text><line x1="935.0" y1="650.5" x2="1125.0" y2="650.5" stroke="#000000" stroke-width="1"/><text x="943.0" y="666.5" font-size="9.5">entry / motivo obligatorio</text><circle cx="310" cy="650" r="14" fill="none" stroke="#000000" stroke-width="1.6"/><circle cx="310" cy="650" r="8" fill="#000000"/><path d="M102,180 L184,180" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="115.0" y="171.0" width="56.0" height="13" fill="#FFFFFF"/><text x="143.0" y="181.0" font-size="9.5" text-anchor="middle">crear OM</text><path d="M375,180 L524,180" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="412.5" y="151" width="74.0" height="13" fill="#FFFFFF"/><text x="449.5" y="161" font-size="9.5" text-anchor="middle">detallar( )</text><rect x="412.5" y="164" width="74.0" height="13" fill="#FFFFFF"/><text x="449.5" y="174" font-size="9.5" text-anchor="middle">[wo.update]</text><path d="M620,222 L620,352" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="693.0" y="261" width="74.0" height="13" fill="#FFFFFF"/><text x="730" y="271" font-size="9.5" text-anchor="middle">arrancar( )</text><rect x="669.0" y="274" width="122.0" height="13" fill="#FFFFFF"/><text x="730" y="284" font-size="9.5" text-anchor="middle">[wo.update + firma]</text><path d="M735,400 L934,400" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="800.5" y="373" width="68.0" height="13" fill="#FFFFFF"/><text x="834.5" y="383" font-size="9.5" text-anchor="middle">esperar( )</text><rect x="782.5" y="386" width="104.0" height="13" fill="#FFFFFF"/><text x="834.5" y="396" font-size="9.5" text-anchor="middle">[falta material]</text><path d="M934,428 L830,428 L830,442 L735,442" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="797.5" y="451" width="74.0" height="13" fill="#FFFFFF"/><text x="834.5" y="461" font-size="9.5" text-anchor="middle">reanudar( )</text><path d="M620,460 L620,602" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="705.0" y="511" width="110.0" height="13" fill="#FFFFFF"/><text x="760" y="521" font-size="9.5" text-anchor="middle">cerrarConFirma( )</text><rect x="702.0" y="524" width="116.0" height="13" fill="#FFFFFF"/><text x="760" y="534" font-size="9.5" text-anchor="middle">[wo.approve — SÓLO</text><rect x="681.0" y="537" width="158.0" height="13" fill="#FFFFFF"/><text x="760" y="547" font-size="9.5" text-anchor="middle">el Jefe de Mantenimiento]</text><path d="M720,650 L934,650" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="796.0" y="623" width="62.0" height="13" fill="#FFFFFF"/><text x="827.0" y="633" font-size="9.5" text-anchor="middle">anular( )</text><rect x="787.0" y="636" width="80.0" height="13" fill="#FFFFFF"/><text x="827.0" y="646" font-size="9.5" text-anchor="middle">[wo.approve]</text><path d="M520,650 L325,650" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><path d="M280,208 L280,616" fill="none" stroke="#000000" stroke-width="1.3" marker-end="url(#asol)"/><rect x="126.0" y="391" width="98.0" height="13" fill="#FFFFFF"/><text x="175" y="401" font-size="9.5" text-anchor="middle">anular antes de</text><rect x="111.0" y="404" width="128.0" height="13" fill="#FFFFFF"/><text x="175" y="414" font-size="9.5" text-anchor="middle">empezar [wo.approve]</text><path d="M60,730 L360,730 L372,742 L372,845 L60,845 z" fill="#FFFFF0" stroke="#000000" stroke-width="1.2"/><path d="M360,730 L360,742 L372,742" fill="none" stroke="#000000" stroke-width="1.2"/><text x="216" y="768.8" font-size="9.2" fill="#101010" font-weight="normal" text-anchor="middle" font-style="italic">«nota» ABRIR NO ES CERRAR. Abrir una orden de más se</text><text x="216" y="780.0" font-size="9.2" fill="#101010" font-weight="normal" text-anchor="middle" font-style="italic">ve en la lista y se anula; una CERRADA de más lleva</text><text x="216" y="791.2" font-size="9.2" fill="#101010" font-weight="normal" text-anchor="middle" font-style="italic">firma y materiales retirados: afirma que un trabajo</text><text x="216" y="802.4" font-size="9.2" fill="#101010" font-weight="normal" text-anchor="middle" font-style="italic">se hizo. Por eso el cierre exige wo.approve y no se</text><text x="216" y="813.7" font-size="9.2" fill="#101010" font-weight="normal" text-anchor="middle" font-style="italic">ha movido en ocho bloques.</text><path d="M760,730 L1360,730 L1372,742 L1372,845 L760,845 z" fill="#F4F8FF" stroke="#000000" stroke-width="1.2"/><path d="M1360,730 L1360,742 L1372,742" fill="none" stroke="#000000" stroke-width="1.2"/><text x="1066" y="757.6" font-size="9.4" fill="#101010" font-weight="normal" text-anchor="middle" font-style="italic">GUARDA DE CONCURRENCIA: la condición de estado viaja DENTRO del «where» de la consulta, no en un «if»</text><text x="1066" y="769.0" font-size="9.4" fill="#101010" font-weight="normal" text-anchor="middle" font-style="italic">previo.</text><text x="1066" y="797.6" font-size="9.4" fill="#101010" font-weight="normal" text-anchor="middle" font-style="italic">Así PostgreSQL comprueba y actualiza en un solo paso y dos técnicos no pueden cerrar la misma orden a la</text><text x="1066" y="809.0" font-size="9.4" fill="#101010" font-weight="normal" text-anchor="middle" font-style="italic">vez.</text><text x="720.0" y="869.7" font-size="10.5" fill="#5A6570" font-weight="normal" text-anchor="middle">Notación UML 2.5 (StarUML) — estados, transiciones con evento [guarda], acciones de entrada y estado final.</text></svg>