<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="780" viewBox="0 0 1600 780" font-family="Segoe UI,Calibri,DejaVu Sans,sans-serif">
<defs>
 <linearGradient id="gTask" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#FFFFFF"/><stop offset="100%" stop-color="#DCE9F6"/></linearGradient>
 <linearGradient id="gGw" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#FFFDF0"/><stop offset="100%" stop-color="#F5E08C"/></linearGradient>
 <linearGradient id="gIni" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#EAF7E2"/><stop offset="100%" stop-color="#BFE3A8"/></linearGradient>
 <linearGradient id="gFin" x1="0" y1="0" x2="0" y2="1">
   <stop offset="0%" stop-color="#FBE3E1"/><stop offset="100%" stop-color="#F0B4AE"/></linearGradient>
 <marker id="fl" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
   <path d="M0,0 L8,3.2 L0,6.4 z" fill="#2B2B2B"/></marker>
 <marker id="flr" markerWidth="9" markerHeight="9" refX="8" refY="3.2" orient="auto">
   <path d="M0,0 L8,3.2 L0,6.4 z" fill="#B02418"/></marker>
</defs>
<rect width="1600" height="780" fill="#FFFFFF"/>
<text x="800.0" y="38.3" font-size="18" fill="#1F3348" font-weight="bold" text-anchor="middle">CAPACIDAD DE CRECIMIENTO — De la evidencia de campo a la decisión de inversión</text><text x="800.0" y="62.2" font-size="12" fill="#6B7480" font-weight="normal" text-anchor="middle">Cada fase se apoya en el dato que produce la anterior. Ninguna requiere rehacer lo construido.</text><rect x="52" y="118" width="352" height="368" rx="10" fill="#EDF4FC" stroke="#1B5E9E" stroke-width="1.6"/><rect x="52" y="118" width="352" height="46" rx="10" fill="#1B5E9E"/><rect x="52" y="148" width="352" height="16" fill="#1B5E9E"/><text x="70" y="148" font-size="14" font-weight="bold" fill="#FFFFFF">FASE 1</text><text x="228.0" y="200.9" font-size="14" fill="#1B5E9E" font-weight="bold" text-anchor="middle">CONSOLIDACIÓN DEL DATO</text><text x="228.0" y="233.7" font-size="10.5" fill="#6B7480" font-weight="normal" text-anchor="middle">En operación</text><line x1="74" y1="250" x2="382" y2="250" stroke="#1B5E9E" stroke-width="1" opacity="0.4"/><text x="74" y="274" font-size="11.2" fill="#1F3348">Cada intervención deja incidencia, orden,</text><text x="74" y="295" font-size="11.2" fill="#1F3348">materiales, fotografías y firma.</text><text x="74" y="316" font-size="11.2" fill="#1F3348">Síntoma, causa y acción salen de catálogo:</text><text x="74" y="337" font-size="11.2" fill="#1F3348">son magnitudes contables, no texto libre.</text><line x1="74" y1="382" x2="382" y2="382" stroke="#1B5E9E" stroke-width="1" opacity="0.4"/><text x="228.0" y="407.5" font-size="10" fill="#1B5E9E" font-weight="bold" text-anchor="middle">LO QUE HABILITA</text><text x="228.0" y="443.9" font-size="11" fill="#1F3348" font-weight="normal" text-anchor="middle">Trazabilidad y evidencia ante auditoría</text><path d="M408,302 L430,302" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><rect x="436" y="118" width="352" height="368" rx="10" fill="#EFF8EC" stroke="#2E7D32" stroke-width="1.6"/><rect x="436" y="118" width="352" height="46" rx="10" fill="#2E7D32"/><rect x="436" y="148" width="352" height="16" fill="#2E7D32"/><text x="454" y="148" font-size="14" font-weight="bold" fill="#FFFFFF">FASE 2</text><text x="612.0" y="200.9" font-size="14" fill="#2E7D32" font-weight="bold" text-anchor="middle">ANALÍTICA DE CONFIABILIDAD</text><text x="612.0" y="233.7" font-size="10.5" fill="#6B7480" font-weight="normal" text-anchor="middle">Requiere 12 meses de historial</text><line x1="458" y1="250" x2="766" y2="250" stroke="#2E7D32" stroke-width="1" opacity="0.4"/><text x="458" y="274" font-size="11.2" fill="#1F3348">MTBF por marca y modelo sobre fallas reales.</text><text x="458" y="295" font-size="11.2" fill="#1F3348">La criticidad A/B/C deja de apoyarse en</text><text x="458" y="316" font-size="11.2" fill="#1F3348">estimación y pasa a apoyarse en la</text><text x="458" y="337" font-size="11.2" fill="#1F3348">frecuencia de falla medida del propio equipo.</text><line x1="458" y1="382" x2="766" y2="382" stroke="#2E7D32" stroke-width="1" opacity="0.4"/><text x="612.0" y="407.5" font-size="10" fill="#2E7D32" font-weight="bold" text-anchor="middle">LO QUE HABILITA</text><text x="612.0" y="443.9" font-size="11" fill="#1F3348" font-weight="normal" text-anchor="middle">Presupuesto de repuestos sustentado en datos</text><path d="M792,302 L814,302" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><rect x="820" y="118" width="352" height="368" rx="10" fill="#FFF7E8" stroke="#8A5A00" stroke-width="1.6"/><rect x="820" y="118" width="352" height="46" rx="10" fill="#8A5A00"/><rect x="820" y="148" width="352" height="16" fill="#8A5A00"/><text x="838" y="148" font-size="14" font-weight="bold" fill="#FFFFFF">FASE 3</text><text x="996.0" y="200.9" font-size="14" fill="#8A5A00" font-weight="bold" text-anchor="middle">AMPLIACIÓN PLANIFICADA</text><text x="996.0" y="233.7" font-size="10.5" fill="#6B7480" font-weight="normal" text-anchor="middle">Habilitada por las fases 1 y 2</text><line x1="842" y1="250" x2="1150" y2="250" stroke="#8A5A00" stroke-width="1" opacity="0.4"/><text x="842" y="274" font-size="11.2" fill="#1F3348">Las zonas sin cobertura se priorizan por</text><text x="842" y="295" font-size="11.2" fill="#1F3348">criticidad productiva y riesgo a personas.</text><text x="842" y="316" font-size="11.2" fill="#1F3348">Cada instalación se programa contra una</text><text x="842" y="337" font-size="11.2" fill="#1F3348">ventana de parada declarada por Producción.</text><line x1="842" y1="382" x2="1150" y2="382" stroke="#8A5A00" stroke-width="1" opacity="0.4"/><text x="996.0" y="407.5" font-size="10" fill="#8A5A00" font-weight="bold" text-anchor="middle">LO QUE HABILITA</text><text x="996.0" y="443.9" font-size="11" fill="#1F3348" font-weight="normal" text-anchor="middle">Obra ordenada, sin detener la producción</text><path d="M1176,302 L1198,302" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><rect x="1204" y="118" width="352" height="368" rx="10" fill="#F5EEFB" stroke="#5B2C83" stroke-width="1.6"/><rect x="1204" y="118" width="352" height="46" rx="10" fill="#5B2C83"/><rect x="1204" y="148" width="352" height="16" fill="#5B2C83"/><text x="1222" y="148" font-size="14" font-weight="bold" fill="#FFFFFF">FASE 4</text><text x="1380.0" y="200.9" font-size="14" fill="#5B2C83" font-weight="bold" text-anchor="middle">MIGRACIÓN A ANALÍTICA DE VÍDEO</text><text x="1380.0" y="233.7" font-size="10.5" fill="#6B7480" font-weight="normal" text-anchor="middle">Habilitada por las fases 1, 2 y 3</text><line x1="1226" y1="250" x2="1534" y2="250" stroke="#5B2C83" stroke-width="1" opacity="0.4"/><text x="1226" y="274" font-size="11.2" fill="#1F3348">La sustitución por cámaras con analítica se</text><text x="1226" y="295" font-size="11.2" fill="#1F3348">decide sobre obsolescencia, criticidad y</text><text x="1226" y="316" font-size="11.2" fill="#1F3348">frecuencia de falla ya registradas.</text><text x="1226" y="337" font-size="11.2" fill="#1F3348">El sistema aporta ubicación, energía y red.</text><line x1="1226" y1="382" x2="1534" y2="382" stroke="#5B2C83" stroke-width="1" opacity="0.4"/><text x="1380.0" y="407.5" font-size="10" fill="#5B2C83" font-weight="bold" text-anchor="middle">LO QUE HABILITA</text><text x="1380.0" y="443.9" font-size="11" fill="#1F3348" font-weight="normal" text-anchor="middle">Inversión dirigida al equipo que la justifica</text><rect x="52" y="518" width="1496" height="106" rx="8" fill="#F4F7FA" stroke="#C9D4E0" stroke-width="1.3"/><text x="70" y="546.2" font-size="12" fill="#1B3A5C" font-weight="bold" text-anchor="start">CONDICIÓN QUE ATRAVIESA LAS CUATRO FASES</text><text x="70" y="575.9" font-size="11" fill="#1F3348" font-weight="normal" text-anchor="start">Ninguna fase avanza sobre estimaciones. El sistema no propone un valor cuando el dato no existe: un equipo sin clasificar aparece como pendiente, nunca</text><text x="70" y="599.9" font-size="11" fill="#1F3348" font-weight="normal" text-anchor="start">como de baja criticidad; un indicador sin muestra suficiente se declara «sin datos» en lugar de mostrar un cero. La decisión de inversión se sostiene sobre lo medido.</text><text x="52" y="669.7" font-size="10.5" fill="#6B7480" font-weight="normal" text-anchor="start">Base ya construida: 78 modelos de datos · 52 migraciones aplicadas · registro de auditoría global por petición · evento de falla con hora de caída, detección, inicio de reparación y restitución.</text><text x="52" y="693.7" font-size="10.5" fill="#6B7480" font-weight="normal" text-anchor="start">Las fases 2, 3 y 4 no requieren rehacer el modelo de datos: se apoyan en los campos que el sistema ya registra en cada intervención desde su puesta en marcha.</text></svg>