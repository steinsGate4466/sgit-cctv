<rect width="1700" height="986" fill="#FFFFFF"/>
<text x="850.0" y="38.5" font-size="18.5" fill="#1F3348" font-weight="bold" text-anchor="middle">PROCESO ACTUAL (AS-IS) — Atención de una falla de CCTV · LAMINACIÓN, Planta Pisco</text><text x="850.0" y="64.4" font-size="12.5" fill="#6B7480" font-weight="normal" text-anchor="middle">La orden SÍ se registra en SAP. Lo que no existe es el seguimiento, la documentación de la intervención ni la ficha del equipo</text><rect x="34" y="90" width="1632" height="680" fill="none" stroke="#9AA4B0" stroke-width="1.4"/><rect x="34" y="90" width="30" height="680" fill="#F2F2F2" stroke="#9AA4B0" stroke-width="1.4"/><text x="49" y="430.0" font-size="13" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 49 430.0)">ATENCIÓN DE UNA FALLA — HOY</text><rect x="64" y="90" width="1602" height="140" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="64" y="90" width="28" height="140" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="78" y="160.0" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 78 160.0)">Operador de Púlpito</text><rect x="64" y="230" width="1602" height="150" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="64" y="230" width="28" height="150" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="78" y="305.0" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 78 305.0)">Jefe de Línea</text><rect x="64" y="380" width="1602" height="200" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="64" y="380" width="28" height="200" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="78" y="480.0" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 78 480.0)">Jefe de Mantenimiento</text><rect x="64" y="580" width="1602" height="190" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="64" y="580" width="28" height="190" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="78" y="675.0" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 78 675.0)">Técnico / Tercería</text><circle cx="140" cy="160" r="17" fill="url(#gIni)" stroke="#5FA544" stroke-width="1.8"/><text x="140" y="197.2" font-size="9" fill="#4A5560" font-weight="normal" text-anchor="middle">Una cámara deja de verse</text><rect x="221.0" y="133.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="280" y="150.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Ve el monitor en</text><text x="280" y="163.7" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">negro desde el</text><text x="280" y="176.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">púlpito</text><rect x="391.0" y="133.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="450" y="150.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Reporta la falla</text><text x="450" y="163.7" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">de viva voz o</text><text x="450" y="176.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">por radio</text><circle cx="450" cy="305" r="17" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.6"/><circle cx="450" cy="305" r="13.5" fill="none" stroke="#2E75B6" stroke-width="1.6"/><rect x="441.5" y="299.0" width="17" height="12" fill="none" stroke="#2E75B6" stroke-width="1.3"/><path d="M441.5,299.0 L450,307.0 L458.5,299.0" fill="none" stroke="#2E75B6" stroke-width="1.3"/><rect x="541.0" y="278.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="600" y="295.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Comunica el</text><text x="600" y="308.7" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">aviso por</text><text x="600" y="321.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">WhatsApp</text><text x="600" y="348.1" font-size="8.8" fill="#6B7480" font-weight="normal" text-anchor="middle">mensaje de chat</text><rect x="770.0" y="285.5" width="260" height="39.0" rx="5" fill="#FDECEA" stroke="#B02418" stroke-width="1.2" stroke-dasharray="4,2.5"/><text x="900" y="302.4" font-size="9.6" fill="#B02418" text-anchor="middle" font-weight="bold">El aviso vive en un chat: se mezcla con el</text><text x="900" y="314.4" font-size="9.6" fill="#B02418" text-anchor="middle" font-weight="bold">resto y no deja cola de trabajo</text><rect x="1150.0" y="279.5" width="300" height="51.0" rx="5" fill="#FDECEA" stroke="#B02418" stroke-width="1.2" stroke-dasharray="4,2.5"/><text x="1300" y="296.4" font-size="9.6" fill="#B02418" text-anchor="middle" font-weight="bold">AQUÍ SE PIERDE LA INFORMACIÓN — hora real de la</text><text x="1300" y="308.4" font-size="9.6" fill="#B02418" text-anchor="middle" font-weight="bold">caída, qué equipo exactamente y qué se veía en</text><text x="1300" y="320.4" font-size="9.6" fill="#B02418" text-anchor="middle" font-weight="bold">pantalla</text><path d="M1300,335 L1300,370 L1010,370" fill="none" stroke="#8A94A0" stroke-width="1.2" stroke-dasharray="4,3"/><circle cx="730" cy="480" r="17" fill="#FFFFFF" stroke="#2E75B6" stroke-width="1.6"/><circle cx="730" cy="480" r="13.5" fill="none" stroke="#2E75B6" stroke-width="1.6"/><rect x="721.5" y="474.0" width="17" height="12" fill="none" stroke="#2E75B6" stroke-width="1.3"/><path d="M721.5,474.0 L730,482.0 L738.5,474.0" fill="none" stroke="#2E75B6" stroke-width="1.3"/><path d="M800,455 L825,480 L800,505 L775,480 z" fill="url(#gGw)" stroke="#C9A227" stroke-width="1.5"/><text x="800" y="484.5" font-size="15" fill="#C9A227" text-anchor="middle">&#215;</text><text x="800" y="529.6" font-size="9.2" fill="#1F3348" font-weight="normal" text-anchor="middle">¿Se sabe qué equipo, dónde y</text><text x="800" y="540.8" font-size="9.2" fill="#1F3348" font-weight="normal" text-anchor="middle">desde cuándo?</text><rect x="742.0" y="382.0" width="116" height="48" rx="9" ry="9" fill="url(#gTask)" stroke="#B02418" stroke-width="1.5"/><text x="800" y="396.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Pregunta de</text><text x="800" y="409.7" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">vuelta o va a</text><text x="800" y="422.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">mirar</text><rect x="931.0" y="453.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="990" y="470.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Crea la orden en</text><text x="990" y="483.7" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">SAP con lo que</text><text x="990" y="496.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">le contaron</text><rect x="1101.0" y="453.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="1160" y="470.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Asigna de</text><text x="1160" y="483.7" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">memoria a quien</text><text x="1160" y="496.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">esté libre</text><path d="M1341.0,394.0 a59.0,9 0 0 1 118,0 L1459.0,438.0 a59.0,9 0 0 1 -118,0 z" fill="#F4F7FB" stroke="#5B6B7C" stroke-width="1.4"/><path d="M1341.0,394.0 a59.0,9 0 0 0 118,0" fill="none" stroke="#5B6B7C" stroke-width="1.4"/><text x="1400" y="422.0" font-size="11.5" fill="#33475B" font-weight="bold" text-anchor="middle">SAP</text><text x="1400" y="437.1" font-size="8.8" fill="#6B7480" font-weight="normal" text-anchor="middle">orden registrada</text><rect x="931.0" y="609.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#B02418" stroke-width="1.5"/><text x="990" y="626.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Sube al punto</text><text x="990" y="639.7" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">sin ficha del</text><text x="990" y="652.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">equipo</text><rect x="1101.0" y="609.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="1160" y="633.3" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Diagnostica y</text><text x="1160" y="646.1" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">repara</text><rect x="1271.0" y="609.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#B02418" stroke-width="1.5"/><text x="1330" y="626.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Lo cuenta de</text><text x="1330" y="639.7" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">palabra al</text><text x="1330" y="652.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">volver</text><circle cx="1460" cy="636" r="17" fill="url(#gFin)" stroke="#B02418" stroke-width="3.4"/><rect x="575.0" y="610.5" width="250" height="51.0" rx="5" fill="#FDECEA" stroke="#B02418" stroke-width="1.2" stroke-dasharray="4,2.5"/><text x="700" y="627.4" font-size="9.6" fill="#B02418" text-anchor="middle" font-weight="bold">Sin acceso, criticidad ni historial: la</text><text x="700" y="639.4" font-size="9.6" fill="#B02418" text-anchor="middle" font-weight="bold">intervención es lenta y no se pudo</text><text x="700" y="651.4" font-size="9.6" fill="#B02418" text-anchor="middle" font-weight="bold">planificar</text><rect x="1010.0" y="708.5" width="300" height="39.0" rx="5" fill="#FDECEA" stroke="#B02418" stroke-width="1.2" stroke-dasharray="4,2.5"/><text x="1160" y="725.4" font-size="9.6" fill="#B02418" text-anchor="middle" font-weight="bold">La intervención NO se documenta: sin síntoma,</text><text x="1160" y="737.4" font-size="9.6" fill="#B02418" text-anchor="middle" font-weight="bold">causa, acción ni evidencia. No hay informe.</text><path d="M157,160 L221,160" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M339,160 L391,160" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M450,187 L450,288" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M467,305 L541,305" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M659,305 L730,305 L730,463" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M747,480 L775,480" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M825,480 L931,480" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><rect x="868.6" y="462" width="18.8" height="14" fill="#FFFFFF" opacity="0.92"/><text x="878" y="473" font-size="9.5" fill="#2B2B2B" text-anchor="middle">Sí</text><path d="M800,455 L800,430" fill="none" stroke="#B02418" stroke-width="1.4" marker-end="url(#flr)"/><rect x="814.6" y="434" width="18.8" height="14" fill="#FFFFFF" opacity="0.92"/><text x="824" y="445" font-size="9.5" fill="#B02418" text-anchor="middle">No</text><path d="M858,406 L990,406 L990,453" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)" stroke-dasharray="5,3"/><text x="924" y="395.0" font-size="8.6" fill="#6B7480" font-weight="normal" text-anchor="middle">vuelve con el dato</text><path d="M1049,480 L1101,480" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M1160,507 L1160,552 L990,552 L990,609" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M825,636 L931,636" fill="none" stroke="#8A94A0" stroke-width="1.2" stroke-dasharray="4,3"/><path d="M1049,636 L1101,636" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M1219,636 L1271,636" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M1389,636 L1443,636" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M1020,453 L1020,416 L1341,416" fill="none" stroke="#8A94A0" stroke-width="1.2" stroke-dasharray="4,3"/><text x="1180" y="405.1" font-size="8.8" fill="#6B7480" font-weight="normal" text-anchor="middle">se escribe UNA vez · nadie la sigue después</text><rect x="34" y="796" width="800" height="150" rx="6" fill="#FFF7E8" stroke="#8A5A00" stroke-width="1.3"/><text x="46" y="815" font-size="11.5" font-weight="bold" fill="#8A5A00">LO QUE SÍ HAY — Y POR QUÉ NO BASTA</text><text x="46" y="834" font-size="10" fill="#1F3348">• La orden SÍ queda registrada en SAP: no se trabaja con papel ni con cuaderno.</text><text x="46" y="851" font-size="10" fill="#1F3348">• Pero SAP recibe una orden y nadie le hace seguimiento: no dice en qué va, quién la tiene ni si se cerró.</text><text x="46" y="868" font-size="10" fill="#1F3348">• No guarda la hora real de la caída, así que el MTTR no se puede calcular.</text><text x="46" y="885" font-size="10" fill="#1F3348">• No guarda síntoma, causa ni acción codificados: no se puede contar qué equipo falla más.</text><rect x="866" y="796" width="800" height="150" rx="6" fill="#FDF1F0" stroke="#B02418" stroke-width="1.3"/><text x="878" y="815" font-size="11.5" font-weight="bold" fill="#B02418">CONSECUENCIA PARA JEFATURA</text><text x="878" y="834" font-size="10" fill="#1F3348">• Intervenciones LENTAS y SIN PLANIFICACIÓN, por falta de información real del equipo.</text><text x="878" y="851" font-size="10" fill="#1F3348">• Sin evidencia documental de la intervención ante una auditoría interna o externa.</text><text x="878" y="868" font-size="10" fill="#1F3348">• Todo es correctivo: no existe el criterio objetivo que determine la frecuencia del preventivo.</text><text x="878" y="885" font-size="10" fill="#1F3348">• El presupuesto se solicita sin sustento: no se sabe qué equipo concentra las fallas.</text><text x="38" y="973.5" font-size="10" fill="#6B7480" font-weight="normal" text-anchor="start">Notación BPMN 2.0 (Bizagi Modeler) — calles por rol, eventos de mensaje, compuerta exclusiva, almacén de datos y anotaciones de fuga.</text></svg>