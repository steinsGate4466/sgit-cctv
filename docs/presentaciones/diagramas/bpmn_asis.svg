<text x="750.0" y="36.0" font-size="17" fill="#1F3348" font-weight="bold" text-anchor="middle">PROCESO ACTUAL (AS-IS) — Atención de fallas de CCTV y red · Laminación, Planta Pisco</text><text x="750.0" y="59.2" font-size="12" fill="#6B7480" font-weight="normal" text-anchor="middle">Sin sistema: el registro vive en el papel, en el WhatsApp y en la memoria de cada uno</text><rect x="36" y="80" width="1160" height="650" fill="none" stroke="#9AA4B0" stroke-width="1.4"/><rect x="36" y="80" width="30" height="650" fill="#F2F2F2" stroke="#9AA4B0" stroke-width="1.4"/><text x="51" y="405.0" font-size="13" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 51 405.0)">ATENCIÓN DE UNA FALLA — HOY</text><rect x="66" y="80" width="1130" height="150" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="80" width="28" height="150" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="155.0" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 155.0)">Operador de Púlpito</text><rect x="66" y="230" width="1130" height="175" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="230" width="28" height="175" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="317.5" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 317.5)">Jefe de Tren</text><rect x="66" y="405" width="1130" height="175" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="405" width="28" height="175" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="492.5" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 492.5)">Jefe de Mantenimiento</text><rect x="66" y="580" width="1130" height="150" fill="none" stroke="#9AA4B0" stroke-width="1.1"/><rect x="66" y="580" width="28" height="150" fill="#FAFAFA" stroke="#9AA4B0" stroke-width="1.1"/><text x="80" y="655.0" font-size="11.5" fill="#1F3348" font-weight="bold" text-anchor="middle" transform="rotate(-90 80 655.0)">Técnico / Tercería</text><circle cx="140" cy="155.0" r="17" fill="url(#gIni)" stroke="#5FA544" stroke-width="1.8"/><rect x="221.0" y="128.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="280" y="152.3" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Ve un monitor en</text><text x="280" y="165.1" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">negro</text><rect x="381.0" y="128.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="440" y="152.3" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Avisa por radio</text><text x="440" y="165.1" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">o WhatsApp</text><rect x="1031.0" y="128.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#B02418" stroke-width="1.5"/><text x="1090" y="145.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">SE PIERDE: nadie</text><text x="1090" y="158.7" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">vuelve a saber</text><text x="1090" y="171.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">de ello</text><rect x="541.0" y="290.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="600" y="308.4" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Anota en un</text><text x="600" y="321.2" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">cuaderno (a</text><text x="600" y="334.0" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">veces)</text><rect x="711.0" y="290.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="770" y="314.8" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Llama al Jefe de</text><text x="770" y="327.6" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Mantenimiento</text><path d="M930,292.5 L955,317.5 L930,342.5 L905,317.5 z" fill="url(#gGw)" stroke="#C9A227" stroke-width="1.5"/><text x="930" y="322.0" font-size="15" fill="#C9A227" text-anchor="middle">&#215;</text><text x="930" y="370.0" font-size="9.5" fill="#1F3348" font-weight="normal" text-anchor="middle">¿Se acuerda? ¿Hay gente</text><text x="930" y="381.6" font-size="9.5" fill="#1F3348" font-weight="normal" text-anchor="middle">libre?</text><rect x="541.0" y="465.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="600" y="483.4" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Decide de</text><text x="600" y="496.2" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">memoria a quién</text><text x="600" y="509.0" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">mandar</text><rect x="711.0" y="465.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="770" y="483.4" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Llena la OM en</text><text x="770" y="496.2" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">papel o en un</text><text x="770" y="509.0" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Excel suelto</text><rect x="711.0" y="628.0" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="770" y="645.9" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Sube, repara y</text><text x="770" y="658.7" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">lo cuenta de</text><text x="770" y="671.5" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">palabra</text><rect x="941.0" y="465.5" width="118" height="54" rx="9" ry="9" fill="url(#gTask)" stroke="#2E75B6" stroke-width="1.5"/><text x="1000" y="489.8" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">Archiva el papel</text><text x="1000" y="502.6" font-size="10.5" fill="#1F3348" font-weight="normal" text-anchor="middle">en un fólder</text><circle cx="1160" cy="492.5" r="17" fill="url(#gFin)" stroke="#B02418" stroke-width="3.4"/><path d="M157,155.0 L220,155.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M339,155.0 L381,155.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M499,155.0 L545,155.0 L545,317.5 L540,317.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M659,317.5 L711,317.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M829,317.5 L905,317.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M930,292.5 L930,155.0 L1031,155.0" fill="none" stroke="#B02418" stroke-width="1.4" marker-end="url(#flr)"/><rect x="945.6" y="139.0" width="18.8" height="14" fill="#FFFFFF" opacity="0.92"/><text x="955" y="150.0" font-size="9.5" fill="#B02418" text-anchor="middle">No</text><path d="M930,342.5 L930,440.5 L600,440.5 L600,465.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><rect x="870.6" y="426.5" width="18.8" height="14" fill="#FFFFFF" opacity="0.92"/><text x="880" y="437.5" font-size="9.5" fill="#2B2B2B" text-anchor="middle">Sí</text><path d="M659,492.5 L711,492.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M770,519.5 L770,628.0" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M829,655.0 L1000,655.0 L1000,519.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><path d="M1059,492.5 L1143,492.5" fill="none" stroke="#2B2B2B" stroke-width="1.4" marker-end="url(#fl)"/><rect x="1256" y="80" width="228" height="292" rx="6" fill="#FDF1F0" stroke="#B02418" stroke-width="1.3"/><text x="1268" y="99" font-size="11.5" font-weight="bold" fill="#B02418">LO QUE SE PIERDE AQUÍ</text><text x="1268" y="118" font-size="10" fill="#1F3348">• La avería avisada por radio no</text><text x="1268" y="132" font-size="10" fill="#1F3348">   deja NINGÚN rastro: si nadie la</text><text x="1268" y="146" font-size="10" fill="#1F3348">   atiende, no existió.</text><text x="1268" y="163" font-size="10" fill="#1F3348">• No hay hora de caída ni hora de</text><text x="1268" y="177" font-size="10" fill="#1F3348">   reparación: el MTTR no se puede</text><text x="1268" y="191" font-size="10" fill="#1F3348">   calcular.</text><text x="1268" y="208" font-size="10" fill="#1F3348">• La causa raíz se cuenta de</text><text x="1268" y="222" font-size="10" fill="#1F3348">   palabra y no se puede contar</text><text x="1268" y="236" font-size="10" fill="#1F3348">   después.</text><text x="1268" y="253" font-size="10" fill="#1F3348">• El fólder no se puede buscar ni</text><text x="1268" y="267" font-size="10" fill="#1F3348">   filtrar.</text><rect x="1256" y="388" width="228" height="292" rx="6" fill="#FFF7E8" stroke="#8A5A00" stroke-width="1.3"/><text x="1268" y="407" font-size="11.5" font-weight="bold" fill="#8A5A00">CONSECUENCIA PARA JEFATURA</text><text x="1268" y="426" font-size="10" fill="#1F3348">• Sin evidencia documental ante</text><text x="1268" y="440" font-size="10" fill="#1F3348">   una auditoría.</text><text x="1268" y="457" font-size="10" fill="#1F3348">• No se sabe qué equipo falla más:</text><text x="1268" y="471" font-size="10" fill="#1F3348">   el presupuesto se pide sin</text><text x="1268" y="485" font-size="10" fill="#1F3348">   sustento.</text><text x="1268" y="502" font-size="10" fill="#1F3348">• Todo es correctivo: se apaga el</text><text x="1268" y="516" font-size="10" fill="#1F3348">   incendio, no se previene.</text><text x="1268" y="533" font-size="10" fill="#1F3348">• Si el técnico se va, el</text><text x="1268" y="547" font-size="10" fill="#1F3348">   conocimiento se va con él.</text><text x="40" y="775.5" font-size="10" fill="#6B7480" font-weight="normal" text-anchor="start">Notación BPMN 2.0 (Bizagi Modeler) — calles por rol, compuerta exclusiva y eventos de inicio/fin.</text></svg>