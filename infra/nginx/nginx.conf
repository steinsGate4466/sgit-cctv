# SGIT-CCTV — Nginx reverse proxy (TLS termina aquí en producción)
worker_processes auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;

  # Límite de subida (planos/manuales/backups)
  client_max_body_size 100M;

  upstream sgit_api {
    server api:3000;
  }

  server {
    listen 80;
    server_name _;

    # API REST
    location /api/ {
      proxy_pass         http://sgit_api;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Documentación OpenAPI
    location /docs {
      proxy_pass http://sgit_api;
    }

    # SPA (frontend build) — se servirá aquí en fases posteriores
    location / {
      return 200 'SGIT-CCTV API activa. Frontend pendiente (fase F4).';
      add_header Content-Type text/plain;
    }
  }
}
