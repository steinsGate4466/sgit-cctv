# =============================================================================
#  SGIT-CCTV - Integracion Continua
#  Aceros Arequipa - Planta Pisco - Laminacion
#
#  Objetivo: que NINGUN error de compilacion llegue a Railway.
#  Antes, un error de tipos (ej. TS2339) solo aparecia cuando Railway
#  intentaba construir la imagen: tarde, en produccion y sin diagnostico.
#  Ahora se detecta aqui, en cada push, antes de desplegar.
# =============================================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  #  1) BACKEND - el que habria atrapado el fallo de Railway
  # ---------------------------------------------------------------------------
  backend:
    name: Backend - tipos, compilacion y pruebas
    runs-on: ubuntu-latest
    env:
      # Prisma exige la variable para LEER el esquema. No se conecta a ninguna
      # base de datos: generate y validate funcionan sin conexion.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci instala EXACTAMENTE lo del package-lock.json.
      # Es lo correcto en CI: reproducible y no altera el lock.
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      # El cliente de Prisma es codigo generado. Sin este paso, TypeScript no
      # conoce los tipos de los modelos y la compilacion falla.
      - name: Generar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Validar el esquema de datos
        working-directory: backend
        run: npx prisma validate

      # === PASO CLAVE ===
      # nest build ejecuta el compilador de TypeScript de verdad.
      # Aqui es donde se caza el error que rompio el despliegue en Railway.
      - name: Compilar (verificacion de tipos real)
        working-directory: backend
        run: npm run build

      # Comprueba que cada dependencia inyectada por constructor esté
      # declarada en su modulo. El 01/08 esto tumbo el arranque en produccion
      # y ni build ni test lo vieron: es un dato de tiempo de ejecucion.
      - name: Verificar inyeccion de dependencias
        working-directory: backend
        run: npm run verificar:inyeccion

      # Filtros de Prisma anidados por error. El 02/08 esto devolvio 400 en
      # el tablero de produccion y ni build ni test lo vieron: la constante
      # estaba anotada ': any', que apaga justo la comprobacion que lo caza.
      - name: Verificar filtros de Prisma
        working-directory: backend
        run: npm run verificar:filtros

      # Desfase entre schema.prisma y las migraciones, SIN base de datos.
      # El trabajo `migraciones` de mas abajo hace la comprobacion completa con
      # `prisma migrate diff`, pero tarda minutos porque levanta un Postgres.
      # Esta version lee los .sql y falla en medio segundo, asi que el aviso
      # llega al principio del CI y no al final.
      # 12.4 - REVISION DE DEPENDENCIAS. INFORMA, NO ROMPE.
      # `continue-on-error: true` es deliberado: un aviso nuevo en una libreria
      # transitiva no puede bloquear un despliegue de planta un martes por la
      # tarde. Queda en el registro para revisarlo cuando toque.
      # NUNCA se ejecuta `npm audit fix --force` aqui: eso sube versiones
      # mayores solo y es exactamente lo que este proyecto tiene prohibido.
      - name: Revisar dependencias (informativo)
        working-directory: backend
        continue-on-error: true
        run: npm audit --audit-level=high || true

      # El foco que saltaba al primer campo con cada tecla. Un fallo de
      # teclado no lo caza el typecheck ni un test de unidad: lo encontro el
      # usuario despues de semanas.
      - name: Efectos que roban el foco
        working-directory: frontend
        run: npm run verificar:foco

      - name: Revisar dependencias del frontend (informativo)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high || true

      - name: Campos de Prisma que no existen
        working-directory: backend
        run: npm run verificar:campos

      - name: Verificar migraciones (lectura, sin base de datos)
        working-directory: backend
        run: npm run verificar:migraciones

      # `new X()` sobre un modulo importado con `import * as`. Compila sin una
      # queja y revienta al pulsar el boton. Paso el 02/08 con la hoja de
      # etiquetas de gabinetes.
      - name: Verificar constructores
        working-directory: backend
        run: npm run verificar:constructores

      # El control de acceso vive en cinco sitios que nadie obliga a coincidir:
      # la semilla, los @RequirePermissions, el catalogo de la pantalla de
      # Roles, los can() del frontend y los `role === 'Nombre'` sueltos.
      # Cuando uno se desincroniza NO revienta nada: simplemente deja de
      # proteger, o esconde una pantalla para siempre. Encontro 11 desfases
      # el 13/08, entre ellos que la semilla revocaba permisos al ejecutarse.
      - name: Roles y permisos sin desfase
        working-directory: backend
        run: npm run verificar:roles

      # Node 20 murio el 30/04/2026 y el proyecto siguio sobre el tres meses y
      # medio sin parches, porque una version sin soporte NO se rompe: sigue
      # funcionando igual. Esto lo caza, y ademas comprueba que Dockerfile, CI
      # y engines digan los tres la misma version.
      - name: Node con soporte y una sola version declarada
        working-directory: backend
        run: npm run verificar:node

      # El contenedor arrancaba con `prisma db push`, que NO aplica migraciones
      # y puede ELIMINAR COLUMNAS. Llevaba meses ahi: con la base vacia nunca
      # paso nada, asi que nada aviso. Lo encontro la auditoria del 13/08.
      - name: Dockerfile sin trampas que cuesten datos
        working-directory: backend
        run: npm run verificar:despliegue

      - name: Pruebas unitarias
        working-directory: backend
        run: npm test -- --ci --runInBand

  # ---------------------------------------------------------------------------
  #  2) FRONTEND - hasta hoy NUNCA se verificaron sus tipos
  # ---------------------------------------------------------------------------
  #  vite build transpila pero NO comprueba tipos. Es decir: un error de
  #  TypeScript en el frontend llegaba a produccion sin que nadie lo notara.
  #  El paso typecheck (tsc --noEmit) cierra ese hueco.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend - tipos y compilacion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci instala EXACTAMENTE lo del package-lock.json: reproducible y no
      # altera el lock. El archivo se genero al instalar ESLint.
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Verificar tipos
        working-directory: frontend
        run: npm run typecheck

      # Reglas de React. Caza la clase de error que TypeScript NO ve:
      # un hook llamado despues de un `if (...) return`, que deja la pantalla
      # en blanco en produccion sin ningun aviso previo.
      - name: Reglas de React (hooks)
        working-directory: frontend
        run: npm run lint

      # El bloque 35 sustituyo 117 window.confirm/alert/prompt por los dialogos
      # de la aplicacion. La 118 se escribe sola si nada lo impide: `confirm(...)`
      # es mas corto que pedir el hook. Ademas de feas, esas ventanas las puede
      # APAGAR el navegador ("impedir que esta pagina cree mas dialogos"), y
      # entonces confirm() devuelve false sin preguntar y el boton deja de
      # funcionar sin ningun error.
      - name: Sin ventanas del navegador
        working-directory: frontend
        run: npm run verificar:dialogos

      # Las 44 pantallas llegaron a 9454 palabras de texto visible sin que
      # nadie lo decidiera: una explicacion cada vez, y cada una razonable por
      # separado. Esto es un TRINQUETE: la deuda vieja esta medida y anotada en
      # LINEA_BASE, pero no puede crecer, y cuando una pantalla mejora su
      # numero baja y ya no puede volver a subir.
      - name: Pantallas que no marean
        working-directory: frontend
        run: npm run verificar:densidad

      - name: Compilar
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  #  3) MIGRACIONES - evita la deuda tecnica silenciosa
  # ---------------------------------------------------------------------------
  #  Problema real que previene: alguien edita schema.prisma y hace push SIN
  #  crear la migracion. En local funciona (por db push), pero Railway aplica
  #  migraciones y queda desincronizado. Aqui se detecta al instante.
  # ---------------------------------------------------------------------------
  migraciones:
    name: Migraciones - sin desfase con el esquema
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostgreSQL 18: la MISMA version mayor que produccion en Railway.
        # Estuvo en 16 mientras produccion ya corria 18.4: probar en una version
        # distinta a la que atiende la planta es pedir una sorpresa.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow?schema=public

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Generar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      # Aplica TODAS las migraciones sobre una base vacia y limpia.
      # Si una migracion esta rota, se descubre aqui y no en produccion.
      - name: Aplicar migraciones sobre base limpia
        working-directory: backend
        run: npx prisma migrate deploy

      # --exit-code devuelve 2 si hay diferencias => el job falla.
      - name: Comprobar que el esquema coincide con las migraciones
        working-directory: backend
        run: |
          if ! npx prisma migrate diff \
              --from-migrations ./prisma/migrations \
              --to-schema-datamodel ./prisma/schema.prisma \
              --shadow-database-url "$DATABASE_URL" \
              --exit-code ; then
            echo "::error::El esquema (schema.prisma) tiene cambios SIN migracion."
            echo "Solucion: cd backend && npx prisma migrate dev --name <nombre-del-cambio>"
            exit 1
          fi

      # `prisma db seed` ejecuta `node dist/seed.js` (asi esta configurado en
      # package.json), de modo que la semilla hay que COMPILARLA antes. Sin este
      # paso falla con "Cannot find module dist/seed.js".
      # Solo se compila la semilla: no hace falta construir todo el backend,
      # de eso ya se encarga el trabajo `backend`.
      - name: Compilar la semilla
        working-directory: backend
        run: npx tsc prisma/seed.ts --outDir dist --rootDir prisma --module commonjs --target ES2021 --esModuleInterop --skipLibCheck

      # La semilla es el punto de partida de la planta. Si se rompe, el
      # despliegue queda sin roles, permisos ni jerarquia de Laminacion.
      - name: Verificar que la semilla funciona
        working-directory: backend
        run: npx prisma db seed
