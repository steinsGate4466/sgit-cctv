# =============================================================================
#  SGIT-CCTV - Integracion Continua
#  Aceros Arequipa - Planta Pisco - Laminacion
#
#  Objetivo: que NINGUN error de compilacion llegue a Railway.
#  Antes, un error de tipos (ej. TS2339) solo aparecia cuando Railway
#  intentaba construir la imagen: tarde, en produccion y sin diagnostico.
#  Ahora se detecta aqui, en cada push, antes de desplegar.
# =============================================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  #  1) BACKEND - el que habria atrapado el fallo de Railway
  # ---------------------------------------------------------------------------
  backend:
    name: Backend - tipos, compilacion y pruebas
    runs-on: ubuntu-latest
    env:
      # Prisma exige la variable para LEER el esquema. No se conecta a ninguna
      # base de datos: generate y validate funcionan sin conexion.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Preparar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci instala EXACTAMENTE lo del package-lock.json.
      # Es lo correcto en CI: reproducible y no altera el lock.
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      # El cliente de Prisma es codigo generado. Sin este paso, TypeScript no
      # conoce los tipos de los modelos y la compilacion falla.
      - name: Generar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Validar el esquema de datos
        working-directory: backend
        run: npx prisma validate

      # === PASO CLAVE ===
      # nest build ejecuta el compilador de TypeScript de verdad.
      # Aqui es donde se caza el error que rompio el despliegue en Railway.
      - name: Compilar (verificacion de tipos real)
        working-directory: backend
        run: npm run build
      # ─────────────────────────────────────────────────────────────────
      #  LOS 16 VERIFICADORES DEL BACKEND, DE UNA SOLA VEZ
      # ─────────────────────────────────────────────────────────────────
      #  ANTES eran trece pasos escritos a mano, y la lista se quedo atras:
      #  `sql-roles`, `cable`, `estructura`, `dto`, `relaciones`, `escrituras`
      #  y `ambito` NUNCA se ejecutaban aqui. El de ambito es el de OWASP A01
      #  —el que impide pedir por identificador algo de otro tren—.
      #
      #  UN CONTROL QUE NO SE EJECUTA NO ES UN CONTROL. Y una lista que hay
      #  que acordarse de ampliar es un agujero con fecha: cada verificador
      #  nuevo nacia sin correr en la CI y nadie se enteraba.
      #
      #  Ahora se llama al AGREGADO. Si manana se anade el numero 17, entra
      #  solo. Lo vigila `verificar-ci.js`, que comprueba que este paso siga
      #  llamando al agregado y no vuelva a una lista a mano.
      - name: Los 16 verificadores del backend
        working-directory: backend
        run: npm run verificar
      - name: Vulnerabilidades altas en el backend
        working-directory: backend
        run: npm audit --audit-level=high
      - name: Vulnerabilidades altas en el frontend
        working-directory: frontend
        run: npm audit --audit-level=high
      - name: Verificar tipos (incluidas las pruebas)
        working-directory: backend
        run: npm run typecheck

      - name: Pruebas unitarias
        working-directory: backend
        run: npm test -- --ci --runInBand

  # ---------------------------------------------------------------------------
  #  2) FRONTEND - hasta hoy NUNCA se verificaron sus tipos
  # ---------------------------------------------------------------------------
  #  vite build transpila pero NO comprueba tipos. Es decir: un error de
  #  TypeScript en el frontend llegaba a produccion sin que nadie lo notara.
  #  El paso typecheck (tsc --noEmit) cierra ese hueco.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend - tipos y compilacion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Preparar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci instala EXACTAMENTE lo del package-lock.json: reproducible y no
      # altera el lock. El archivo se genero al instalar ESLint.
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Verificar tipos
        working-directory: frontend
        run: npm run typecheck

      # Reglas de React. Caza la clase de error que TypeScript NO ve:
      # un hook llamado despues de un `if (...) return`, que deja la pantalla
      # en blanco en produccion sin ningun aviso previo.
      - name: Reglas de React (hooks)
        working-directory: frontend
        run: npm run lint

      # ─────────────────────────────────────────────────────────────────
      #  LOS 18 VERIFICADORES DEL FRONTEND, DE UNA SOLA VEZ
      # ─────────────────────────────────────────────────────────────────
      #  Mismo motivo que en el backend: eran diecisiete pasos escritos a
      #  mano. El agregado no existia siquiera en `package.json`; se crea
      #  aqui para que haya UNA sola lista y no dos que se desincronizan.
      - name: Los 18 verificadores del frontend
        working-directory: frontend
        run: npm run verificar
      - name: Compilar
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  #  3) MIGRACIONES - evita la deuda tecnica silenciosa
  # ---------------------------------------------------------------------------
  #  Problema real que previene: alguien edita schema.prisma y hace push SIN
  #  crear la migracion. En local funciona (por db push), pero Railway aplica
  #  migraciones y queda desincronizado. Aqui se detecta al instante.
  # ---------------------------------------------------------------------------
  migraciones:
    name: Migraciones - sin desfase con el esquema
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostgreSQL 18: la MISMA version mayor que produccion en Railway.
        # Estuvo en 16 mientras produccion ya corria 18.4: probar en una version
        # distinta a la que atiende la planta es pedir una sorpresa.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow?schema=public
      # DOS BASES DISTINTAS, y hace falta que sean dos.
      #
      # `migrate diff --from-migrations` reproduce las 40 migraciones desde
      # cero para compararlas con el esquema, y para eso necesita una base
      # DESECHABLE que BORRA Y RECREA. Prisma se niega —con razon— si esa base
      # es la misma que la principal:
      #
      #   Error: The shadow database you configured appears to be the same as
      #          the main database.
      #
      # Menos mal que se niega: si la aceptara, borraria la base principal para
      # hacer una comparacion.
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_sombra?schema=public

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Preparar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # El servicio de PostgreSQL solo crea la base de POSTGRES_DB. La segunda
      # —la desechable de arriba— hay que crearla a mano.
      - name: Crear la base de sombra
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d ci_shadow \
            -c 'CREATE DATABASE ci_sombra;'

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Generar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      # Aplica TODAS las migraciones sobre una base vacia y limpia.
      # Si una migracion esta rota, se descubre aqui y no en produccion.
      - name: Aplicar migraciones sobre base limpia
        working-directory: backend
        run: npx prisma migrate deploy

      # --exit-code devuelve 2 si hay diferencias => el job falla.
      - name: Comprobar que el esquema coincide con las migraciones
        working-directory: backend
        run: |
          # PRISMA 7 (bloque 52) cambio DOS cosas de este comando:
          #
          #   --shadow-database-url   -> eliminado. La base de sombra se
          #                              declara ahora en prisma.config.ts.
          #   --to-schema-datamodel   -> eliminado. Ahora es --to-schema.
          #
          # El segundo no lo vi al migrar y tumbo este trabajo. El mensaje era
          # claro pero solo aparece al ejecutarlo:
          #   `--to-schema-datamodel` was removed. Please use `--[from/to]-schema`
          if ! npx prisma migrate diff \
              --from-migrations ./prisma/migrations \
              --to-schema ./prisma/schema.prisma \
              --exit-code ; then
            echo "::error::El esquema (schema.prisma) tiene cambios SIN migracion."
            echo "Solucion: cd backend && npx prisma migrate dev --name <nombre-del-cambio>"
            exit 1
          fi

      # `prisma db seed` ejecuta `node dist/seed.js`. A partir de PRISMA 7
      # (bloque 52) eso se declara en prisma.config.ts y NO en la clave
      # `prisma` del package.json, que se elimino. Ademas la v7 ya no ejecuta
      # la semilla sola despues de migrar: hay que invocarla, y por suerte
      # aqui siempre se invoco a mano.
      #
      # La semilla hay que COMPILARLA antes. Sin este
      # paso falla con "Cannot find module dist/seed.js".
      # Solo se compila la semilla: no hace falta construir todo el backend,
      # de eso ya se encarga el trabajo `backend`.
      - name: Compilar la semilla
        working-directory: backend
        # --rootDir . y no `prisma`: desde Prisma 7 la semilla importa el
        # cliente desde src/generated, que esta FUERA de prisma/, y con el
        # rootDir viejo TypeScript falla con TS6059. La salida pasa a ser
        # dist/prisma/seed.js, que es lo que declara prisma.config.ts.
        run: npx tsc prisma/seed.ts --outDir dist --rootDir . --module commonjs --target ES2021 --esModuleInterop --skipLibCheck

      # La semilla es el punto de partida de la planta. Si se rompe, el
      # despliegue queda sin roles, permisos ni jerarquia de Laminacion.
      - name: Verificar que la semilla funciona
        working-directory: backend
        run: npx prisma db seed

  # ---------------------------------------------------------------------------
  #  4) ARRANQUE REAL - el hueco que ya tumbo produccion una vez
  # ---------------------------------------------------------------------------
  #  QUE PREVIENE, EN CONCRETO
  #  El 01/08 una dependencia inyectada por constructor no estaba declarada en
  #  su modulo. Compilaba. Pasaba las pruebas. Y reventaba AL LEVANTAR, en
  #  produccion, porque es un dato de tiempo de ejecucion.
  #
  #  Se anadio `verificar:inyeccion` para cazar ese caso concreto leyendo el
  #  codigo, y funciona. Pero es un analisis estatico: sabe de constructores, no
  #  sabe de una variable de entorno que falta, de una migracion que choca con
  #  datos reales, ni de un modulo que se cae al inicializarse por cualquier
  #  otro motivo.
  #
  #  LA UNICA PRUEBA DE QUE LA APLICACION ARRANCA ES ARRANCARLA. Hasta hoy eso
  #  solo pasaba cuando Railway lo intentaba: en el peor momento posible, con la
  #  planta esperando.
  #
  #  Este trabajo levanta Postgres, aplica las 38 migraciones, siembra, compila,
  #  ARRANCA EL BACKEND DE VERDAD y le pide /health. Si no responde, falla aqui.
  #
  #  Va en un trabajo aparte y no dentro de `backend` a proposito: tarda minutos
  #  porque levanta una base, y el resto de comprobaciones tienen que seguir
  #  dando su respuesta en segundos.
  # ---------------------------------------------------------------------------
  arranque:
    name: Arranque real - la aplicacion levanta y responde
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_arranque
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_arranque?schema=public
      # PRODUCCION a proposito. Es el modo en el que corre Pisco, y es el unico
      # en el que se validan de verdad la clave de cifrado y los secretos: en
      # desarrollo el codigo acepta valores por defecto y no probaria nada.
      NODE_ENV: production
      # Valores de USAR Y TIRAR, solo para este contenedor efimero. No son
      # secretos: la base se destruye al terminar el trabajo. Los de Pisco viven
      # en Railway y no aparecen en ningun archivo del repositorio.
      CREDENTIAL_ENC_KEY: clave-de-integracion-continua-no-usar-en-planta-0001
      JWT_SECRET: jwt-de-integracion-continua-no-usar-en-planta-0002
      JWT_REFRESH_SECRET: refresh-de-integracion-continua-no-usar-en-planta-03
      PORT: '3000'
      # SIN ESTO EL BACKEND NO ARRANCA, Y ES CORRECTO QUE NO ARRANQUE.
      # `main.ts` aborta en produccion si falta CORS_ORIGIN: un servidor que no
      # levanta se arregla en dos minutos; uno que levanta con el CORS abierto
      # no se nota nunca. La que faltaba era esta linea, no el guard.
      #
      # Este trabajo solo comprueba que la aplicacion levanta y responde a
      # /health, asi que el valor da igual mientras exista.
      CORS_ORIGIN: http://127.0.0.1:4173

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Preparar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `--include=dev` NO ES DECORATIVO, Y AQUI SE PERDIO UNA TARDE.
      # ---------------------------------------------------------------------
      # Este trabajo declara `NODE_ENV: production` a nivel de JOB, porque es
      # el modo en el que corre Pisco y el unico en el que se validan de verdad
      # los secretos. Pero esa variable la ve TODO el trabajo, `npm ci`
      # incluido — y npm, al leer NODE_ENV=production, se salta las
      # devDependencies sin avisar de nada.
      #
      # Resultado: la instalacion terminaba en VERDE y el paso siguiente moria
      # con `sh: 1: nest: not found`, que parece un problema del compilador de
      # NestJS y no lo es: el fallo estaba tres pasos mas arriba, en un paso
      # que decia haber ido bien.
      #
      # `--include=dev` lo pide explicitamente y deja de depender de una
      # variable declarada en otra parte del archivo.
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci --include=dev

      - name: Generar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      # Lo MISMO que hace el contenedor de Railway al arrancar. Si una migracion
      # choca, se descubre aqui y no con la planta esperando.
      - name: Aplicar migraciones como en produccion
        working-directory: backend
        run: npx prisma migrate deploy

      # Compila la aplicacion Y la semilla, igual que el build real.
      - name: Compilar
        working-directory: backend
        run: npm run build

      - name: Sembrar
        working-directory: backend
        run: npx prisma db seed

      # === EL PASO QUE NO EXISTIA ===
      # Arranca el backend en segundo plano y espera a que /health responda.
      # 60 segundos es de sobra: en local levanta en menos de diez. Si se agota,
      # se vuelca el registro para poder ver POR QUE no arranco.
      - name: Arrancar el backend y esperar a /health
        working-directory: backend
        run: |
          node dist/main.js > arranque.log 2>&1 &
          PID=$!
          echo "Backend arrancando con PID $PID"

          for i in $(seq 1 60); do
            # `kill -0` no mata: comprueba que el proceso sigue vivo. Si se
            # murio, no tiene sentido seguir esperando 50 segundos mas.
            if ! kill -0 $PID 2>/dev/null; then
              echo "::error::El backend MURIO durante el arranque."
              cat arranque.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/health > /dev/null 2>&1; then
              echo "OK: /health respondio a los $i segundos."
              cat arranque.log
              kill $PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done

          echo "::error::/health no respondio en 60 segundos."
          cat arranque.log
          kill $PID 2>/dev/null || true
          exit 1

      # El autochequeo del bloque 44 escribe en el registro si la base no
      # coincide con el codigo. Aqui la base ACABA de sembrarse, asi que no
      # deberia encontrar ni un error: si lo encuentra, es que la semilla y el
      # codigo se han desincronizado y hay que verlo antes de desplegar.
      - name: El autochequeo no encuentra errores sobre una base recien sembrada
        working-directory: backend
        run: |
          if grep -q "ERROR(ES)" arranque.log; then
            echo "::error::El autochequeo encontro errores en una base recien sembrada."
            grep -E "Autochequeo|\[[A-Z_]+\]" arranque.log
            exit 1
          fi
          echo "Autochequeo limpio sobre base recien sembrada."
          grep -E "Autochequeo" arranque.log || true

  # ===========================================================================
  #  RECORRIDOS QUE ABREN EL SOFTWARE  (bloque 85)
  # ===========================================================================
  #
  #  POR QUE EXISTE ESTE TRABAJO, escrito tres veces en CLAUDE.md:
  #
  #    > Las 1.152 pruebas de este proyecto NO ABREN EL SOFTWARE. Comprueban
  #    > que el codigo esta bien escrito. Ninguna comprueba que funcione.
  #
  #  Costo dos veces lo mismo: cuatro bugs de bulto delante del ingeniero
  #  (bloque 64) y lo que encontro una desarrolladora en veinte minutos
  #  (bloque 67). Los ocho se veian ABRIENDO la pantalla, y ninguno rompia
  #  nada: por eso pasaban el typecheck, el lint y los 28 verificadores.
  #
  #  Levanta LA PILA ENTERA -Postgres, backend, frontend- y la usa como la
  #  usaria una persona. Es el unico trabajo del CI que hace eso.
  # ---------------------------------------------------------------------------
  recorridos:
    name: Recorridos - alguien usa el software de verdad
    runs-on: ubuntu-latest
    # Depende del arranque: si el backend ni levanta, estos recorridos solo
    # anadirian ruido rojo sobre un fallo que ya se ha reportado mas arriba.
    needs: arranque

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_e2e
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_e2e?schema=public
      NODE_ENV: production
      # De USAR Y TIRAR, solo para este contenedor efimero. La base se destruye
      # al terminar. Los de Pisco viven en Railway y no estan en el repositorio.
      CREDENTIAL_ENC_KEY: clave-de-recorridos-no-usar-en-planta-000000000001
      JWT_SECRET: jwt-de-recorridos-no-usar-en-planta-0000000000000002
      JWT_REFRESH_SECRET: refresh-de-recorridos-no-usar-en-planta-000000003
      PORT: '3000'
      # La semilla crea el administrador con estos valores; los recorridos
      # entran con ellos. Solo existen dentro de este contenedor.
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: Recorridos.CI.2026
      # Perfil estrecho: sin esto el recorrido 5 —el que caza el menú abierto
      # con el endpoint cerrado— se salta siempre. Sólo existe en la CI.
      SEED_ESTRECHO_EMAIL: tren@ci.local
      SEED_ESTRECHO_PASSWORD: Recorridos.CI.2026
      E2E_JEFE_EMAIL: admin@ci.local
      E2E_JEFE_PASSWORD: Recorridos.CI.2026
      E2E_TECNICO_EMAIL: tren@ci.local
      E2E_TECNICO_PASSWORD: Recorridos.CI.2026
      E2E_URL: http://127.0.0.1:4173

      # LAS DOS PIEZAS QUE HACEN QUE EL NAVEGADOR PUEDA HABLAR CON LA API.
      # -----------------------------------------------------------------------
      # Y `127.0.0.1` en las dos, NO `localhost`: para el navegador son ORIGENES
      # DISTINTOS. Mezclarlos da un fallo de CORS que en la consola se lee como
      # «Network Error», y desde la prueba parece que el backend esta caido.
      #
      # CORS_ORIGIN debe ser EXACTAMENTE de donde se sirve el frontend.
      CORS_ORIGIN: http://127.0.0.1:4173
      # VITE_API_URL se cocina DENTRO del build (`import.meta.env`), asi que
      # tiene que estar puesta ANTES de `npm run build`, no al arrancar. Por
      # defecto el frontend apunta a `localhost:3000` y, servido desde
      # `127.0.0.1`, eso es justo la mezcla de origenes de arriba.
      VITE_API_URL: http://127.0.0.1:3000/api/v1

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v5

      - name: Preparar Node 24
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          # SIN ESTO FALLA ANTES DE EMPEZAR.
          # -------------------------------------------------------------------
          # `cache: npm` busca el lock en la RAIZ del repositorio, y aqui no
          # hay ninguno: este proyecto tiene dos, uno por aplicacion. El error
          # —«Dependencies lock file is not found»— no menciona la cache por
          # ningun lado y parece un problema de checkout.
          #
          # Los otros trabajos ya lo declaraban; este es el unico que toca las
          # DOS aplicaciones, asi que van las dos rutas.
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      # `--include=dev` por lo mismo que en el trabajo de arranque: con
      # NODE_ENV=production, npm se salta las devDependencies SIN AVISAR y el
      # fallo aparece tres pasos mas abajo, disfrazado de otra cosa.
      - name: Instalar backend
        working-directory: backend
        run: npm ci --include=dev

      - name: Preparar la base
        working-directory: backend
        run: |
          npx prisma generate
          npx prisma migrate deploy
          npm run build
          npx prisma db seed

      - name: Instalar frontend
        working-directory: frontend
        run: npm ci --include=dev

      # CHROMIUM **Y WEBKIT**, no solo chromium.
      # ---------------------------------------------------------------------
      # El perfil `movil` usa `devices['iPhone 13']`, y ese perfil corre sobre
      # WEBKIT — el motor de Safari. Instalando solo chromium, las cuatro
      # pruebas de movil fallaban con «Executable doesn't exist», que parece
      # un fallo de la prueba y es un fallo de esta linea.
      #
      # Y webkit es justo el que hace falta: la mitad de los fallos visuales
      # de este proyecto solo se ven ahi. Las fechas que se salian de su caja
      # (bloque 70) se veian bien en Chrome.
      - name: Descargar los navegadores
        working-directory: frontend
        run: npx playwright install --with-deps chromium webkit

      # Se compila y se SIRVE el build, no el servidor de desarrollo. Es lo que
      # de verdad se despliega: el modo desarrollo no trocea los archivos por
      # ruta ni aplica el `lazy-con-reintento`, asi que probar ahi dejaria
      # fuera justo la clase de fallo que se ve tras un despliegue.
      - name: Compilar el frontend
        working-directory: frontend
        run: npm run build

      - name: Levantar la pila y correr los recorridos
        run: |
          node backend/dist/main.js > backend.log 2>&1 &
          API=$!
          # `vite preview` se lanza DESDE frontend/ y en una subshell: si se
          # hiciera un `cd` suelto, el `cd frontend` de mas abajo fallaria y el
          # error diria «no such directory», que no explica nada.
          (cd frontend && npx vite preview --port 4173 --host 127.0.0.1) > web.log 2>&1 &
          WEB=$!

          for i in $(seq 1 60); do
            if ! kill -0 $API 2>/dev/null; then
              echo "::error::El backend MURIO durante el arranque."; cat backend.log; exit 1
            fi
            curl -fsS http://127.0.0.1:3000/health > /dev/null 2>&1 && break
            sleep 1
          done
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:4173 > /dev/null 2>&1 && break
            sleep 1
          done

          # `playwright test` a secas: las credenciales vienen del entorno del
          # trabajo, no de un `.env.e2e` (que ni existe aqui, ni se sube).
          cd frontend && npx playwright test
          CODIGO=$?
          cd ..

          # SI FALLA, EL BACKEND TIENE QUE HABLAR.
          # ---------------------------------------------------------------
          # `backend.log` se subia como adjunto y nadie lo abria: hay que
          # bajar un zip de 35 MB para leer veinte lineas. Mientras tanto, un
          # recorrido rojo por «CORS» mando a revisar la configuracion de CORS
          # —que estaba bien— en vez de mirar lo que habia dicho el servidor.
          #
          # Un diagnostico que exige tres clics no se consulta. Se imprime.
          if [ $CODIGO -ne 0 ]; then
            echo "::group::backend.log (ultimas 120 lineas)"
            tail -n 120 backend.log || echo "(sin backend.log)"
            echo "::endgroup::"
          fi

          kill $API $WEB 2>/dev/null || true
          exit $CODIGO

      # EL INFORME SE GUARDA SI FALLA **O SI SE CANCELA**.
      # ---------------------------------------------------------------------
      # Con `if: failure()` a secas no se guardaba nada cuando el trabajo se
      # CANCELA — y se cancela solo: el `concurrency` de arriba mata la
      # ejecucion anterior en cuanto entra otro push. Paso exactamente eso, y
      # me quede sin poder diagnosticar tres recorridos rojos.
      #
      # Un informe que no esta el dia que hace falta es como si no existiera.
      # En verde sigue sin guardarse: eso si llenaria el almacen de carpetas
      # que nadie abre.
      - name: Guardar el informe si fallo o se cancelo
        if: failure() || cancelled()
        uses: actions/upload-artifact@v5
        with:
          name: recorridos-informe
          path: |
            frontend/playwright-report/
            frontend/test-results/
            backend.log
            web.log
          retention-days: 7
