# =============================================================================
#  SGIT-CCTV - Integracion Continua
#  Aceros Arequipa - Planta Pisco - Laminacion
#
#  Objetivo: que NINGUN error de compilacion llegue a Railway.
#  Antes, un error de tipos (ej. TS2339) solo aparecia cuando Railway
#  intentaba construir la imagen: tarde, en produccion y sin diagnostico.
#  Ahora se detecta aqui, en cada push, antes de desplegar.
# =============================================================================
name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  #  1) BACKEND - el que habria atrapado el fallo de Railway
  # ---------------------------------------------------------------------------
  backend:
    name: Backend - tipos, compilacion y pruebas
    runs-on: ubuntu-latest
    env:
      # Prisma exige la variable para LEER el esquema. No se conecta a ninguna
      # base de datos: generate y validate funcionan sin conexion.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci?schema=public

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # npm ci instala EXACTAMENTE lo del package-lock.json.
      # Es lo correcto en CI: reproducible y no altera el lock.
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      # El cliente de Prisma es codigo generado. Sin este paso, TypeScript no
      # conoce los tipos de los modelos y la compilacion falla.
      - name: Generar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      - name: Validar el esquema de datos
        working-directory: backend
        run: npx prisma validate

      # === PASO CLAVE ===
      # nest build ejecuta el compilador de TypeScript de verdad.
      # Aqui es donde se caza el error que rompio el despliegue en Railway.
      - name: Compilar (verificacion de tipos real)
        working-directory: backend
        run: npm run build

      # Comprueba que cada dependencia inyectada por constructor esté
      # declarada en su modulo. El 01/08 esto tumbo el arranque en produccion
      # y ni build ni test lo vieron: es un dato de tiempo de ejecucion.
      - name: Verificar inyeccion de dependencias
        working-directory: backend
        run: npm run verificar:inyeccion

      # Filtros de Prisma anidados por error. El 02/08 esto devolvio 400 en
      # el tablero de produccion y ni build ni test lo vieron: la constante
      # estaba anotada ': any', que apaga justo la comprobacion que lo caza.
      - name: Verificar filtros de Prisma
        working-directory: backend
        run: npm run verificar:filtros

      # Desfase entre schema.prisma y las migraciones, SIN base de datos.
      # El trabajo `migraciones` de mas abajo hace la comprobacion completa con
      # `prisma migrate diff`, pero tarda minutos porque levanta un Postgres.
      # Esta version lee los .sql y falla en medio segundo, asi que el aviso
      # llega al principio del CI y no al final.
      # 12.4 - REVISION DE DEPENDENCIAS. INFORMA, NO ROMPE.
      # `continue-on-error: true` es deliberado: un aviso nuevo en una libreria
      # transitiva no puede bloquear un despliegue de planta un martes por la
      # tarde. Queda en el registro para revisarlo cuando toque.
      # NUNCA se ejecuta `npm audit fix --force` aqui: eso sube versiones
      # mayores solo y es exactamente lo que este proyecto tiene prohibido.
      - name: Revisar dependencias (informativo)
        working-directory: backend
        continue-on-error: true
        run: npm audit --audit-level=high || true

      # El foco que saltaba al primer campo con cada tecla. Un fallo de
      # teclado no lo caza el typecheck ni un test de unidad: lo encontro el
      # usuario despues de semanas.
      - name: Efectos que roban el foco
        working-directory: frontend
        run: npm run verificar:foco

      - name: Revisar dependencias del frontend (informativo)
        working-directory: frontend
        continue-on-error: true
        run: npm audit --audit-level=high || true

      - name: Campos de Prisma que no existen
        working-directory: backend
        run: npm run verificar:campos

      - name: Verificar migraciones (lectura, sin base de datos)
        working-directory: backend
        run: npm run verificar:migraciones

      # `new X()` sobre un modulo importado con `import * as`. Compila sin una
      # queja y revienta al pulsar el boton. Paso el 02/08 con la hoja de
      # etiquetas de gabinetes.
      - name: Verificar constructores
        working-directory: backend
        run: npm run verificar:constructores

      # El control de acceso vive en cinco sitios que nadie obliga a coincidir:
      # la semilla, los @RequirePermissions, el catalogo de la pantalla de
      # Roles, los can() del frontend y los `role === 'Nombre'` sueltos.
      # Cuando uno se desincroniza NO revienta nada: simplemente deja de
      # proteger, o esconde una pantalla para siempre. Encontro 11 desfases
      # el 13/08, entre ellos que la semilla revocaba permisos al ejecutarse.
      - name: Roles y permisos sin desfase
        working-directory: backend
        run: npm run verificar:roles

      # La pantalla de Roles deja armar un rol marcando cuarenta casillas, y
      # nada avisaba de que acabas de darle a Produccion el modulo de
      # infraestructura entero. Paso: un jefe de linea con Gabinetes,
      # Cableado, Electricidad, Conexiones, Mi bandeja e Indicadores en el
      # menu. Esto impide que las PLANTILLAS de la semilla, que es de donde
      # salen los roles nuevos, vuelvan a nacer asi.
      - name: Roles de observacion sin llaves de operacion
        working-directory: backend
        run: npm run verificar:coherencia

      # Node 20 murio el 30/04/2026 y el proyecto siguio sobre el tres meses y
      # medio sin parches, porque una version sin soporte NO se rompe: sigue
      # funcionando igual. Esto lo caza, y ademas comprueba que Dockerfile, CI
      # y engines digan los tres la misma version.
      - name: Node con soporte y una sola version declarada
        working-directory: backend
        run: npm run verificar:node

      # El contenedor arrancaba con `prisma db push`, que NO aplica migraciones
      # y puede ELIMINAR COLUMNAS. Llevaba meses ahi: con la base vacia nunca
      # paso nada, asi que nada aviso. Lo encontro la auditoria del 13/08.
      - name: Dockerfile sin trampas que cuesten datos
        working-directory: backend
        run: npm run verificar:despliegue

      # El mismo agujero que tenia el frontend hasta el bloque 8, y que aqui
      # duro hasta el 51. `nest build` usa tsconfig.build.json, que EXCLUYE
      # test/ y **/*.spec.ts. Y ts-jest, al ver isolatedModules:true en el
      # tsconfig, transpila SIN comprobar tipos. Resultado: 901 pruebas en
      # verde y 8 errores de TypeScript en test/ que nadie veia, porque no
      # habia un solo paso que mirara esos archivos. Este es ese paso.
      - name: Verificar tipos (incluidas las pruebas)
        working-directory: backend
        run: npm run typecheck

      - name: Pruebas unitarias
        working-directory: backend
        run: npm test -- --ci --runInBand

  # ---------------------------------------------------------------------------
  #  2) FRONTEND - hasta hoy NUNCA se verificaron sus tipos
  # ---------------------------------------------------------------------------
  #  vite build transpila pero NO comprueba tipos. Es decir: un error de
  #  TypeScript en el frontend llegaba a produccion sin que nadie lo notara.
  #  El paso typecheck (tsc --noEmit) cierra ese hueco.
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend - tipos y compilacion
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # npm ci instala EXACTAMENTE lo del package-lock.json: reproducible y no
      # altera el lock. El archivo se genero al instalar ESLint.
      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: Verificar tipos
        working-directory: frontend
        run: npm run typecheck

      # Reglas de React. Caza la clase de error que TypeScript NO ve:
      # un hook llamado despues de un `if (...) return`, que deja la pantalla
      # en blanco en produccion sin ningun aviso previo.
      - name: Reglas de React (hooks)
        working-directory: frontend
        run: npm run lint

      # El bloque 35 sustituyo 117 window.confirm/alert/prompt por los dialogos
      # de la aplicacion. La 118 se escribe sola si nada lo impide: `confirm(...)`
      # es mas corto que pedir el hook. Ademas de feas, esas ventanas las puede
      # APAGAR el navegador ("impedir que esta pagina cree mas dialogos"), y
      # entonces confirm() devuelve false sin preguntar y el boton deja de
      # funcionar sin ningun error.
      - name: Sin ventanas del navegador
        working-directory: frontend
        run: npm run verificar:dialogos

      # Las 44 pantallas llegaron a 9454 palabras de texto visible sin que
      # nadie lo decidiera: una explicacion cada vez, y cada una razonable por
      # separado. Esto es un TRINQUETE: la deuda vieja esta medida y anotada en
      # LINEA_BASE, pero no puede crecer, y cuando una pantalla mejora su
      # numero baja y ya no puede volver a subir.
      - name: Pantallas que no marean
        working-directory: frontend
        run: npm run verificar:densidad

      # 17 sitios usaban toLocaleDateString() SIN idioma. Sin idioma, el
      # navegador usa el del sistema: en un PC en espanol sale 15/8/2026 y en
      # uno en ingles 8/15/2026. El MISMO dato, con dia y mes intercambiados.
      # Una fecha de mantenimiento mal leida es un trabajo hecho el mes que no
      # toca -- un dato incorrecto que parece correcto.
      - name: Fechas que se leen igual en cualquier PC
        working-directory: frontend
        run: npm run verificar:formato

      # =======================================================================
      #  TRES VERIFICADORES QUE EXISTIAN Y NO CORRIAN AQUI (bloque 57)
      # =======================================================================
      #  Al anadir `verificar:clases` se contaron los pasos y salio que de los
      #  OCHO verificadores del frontend, el CI solo ejecutaba CINCO. `cascada`,
      #  `avisos` y `etiquetas` estaban escritos, probados y en package.json,
      #  pero nadie los llamaba: solo corrian si alguien se acordaba a mano.
      #
      #  Un verificador que no corre en el CI no es un verificador: es un
      #  archivo. Es el mismo patron que ya nos mordio con los tipos de las
      #  pruebas y con Node 22 — la comprobacion existia y nadie la miraba.
      # =======================================================================

      # Una regla al final que tapa otra de arriba. La hoja tiene 2900 lineas:
      # el conflicto no se ve leyendo, solo contando.
      - name: Sin reglas de CSS que se pisen
        working-directory: frontend
        run: npm run verificar:cascada

      # Los 44 avisos que no se anunciaban a un lector de pantalla, y la mano
      # del cursor puesta donde no hay nada que pulsar.
      - name: Avisos que se anuncian y manos donde toca
        working-directory: frontend
        run: npm run verificar:avisos

      # 291 rotulos de formulario que no estaban atados a su campo: tocar el
      # texto no enfocaba nada. En el movil, con guante, eso es la diferencia
      # entre acertar y no.
      - name: Cada campo enfocable desde su rotulo
        working-directory: frontend
        run: npm run verificar:etiquetas

      # `new Date(null).toLocaleDateString()` no falla: imprime literalmente
      # "Invalid Date" en medio de una tabla de planta. Habia 21 sitios
      # pintando fechas a mano; ahora todas pasan por src/fechas.ts, que
      # acepta nulos y devuelve "sin fecha".
      - name: Ninguna fecha se pinta a mano
        working-directory: frontend
        run: npm run verificar:fechas

      # El usuario paso el raton por una barra del tablero y le salio
      # "value : 3" -- el nombre interno de la columna, delante del ingeniero
      # al que le estaba enseñando el software. Todo <Tooltip> lleva formatter.
      - name: Los graficos hablan en castellano
        working-directory: frontend
        run: npm run verificar:graficos

      # EL PEOR DE TODOS: el sistema echo al usuario en mitad de una
      # exposicion porque mover el raton no contaba como actividad, y porque
      # una vez salia el aviso ignoraba que siguiera trabajando.
      - name: La sesion no echa a quien esta trabajando
        working-directory: frontend
        run: npm run verificar:sesion

      # Peticion del usuario tras la exposicion: "textos cortos y
      # profesionales en todos los dashboards e incluso formularios".
      # Habia 81 parrafos de hasta 260 caracteres debajo de las tablas.
      - name: Los textos de pantalla son cortos
        working-directory: frontend
        run: npm run verificar:textos

      # Usuarios tenia CUATRO encabezados y CINCO columnas: "Estado" quedaba
      # escrito encima de la columna de trenes. No rompe nada, no lo ve el
      # compilador y no lo ve el lint -- por eso llega a una exposicion.
      - name: Las tablas no salen descuadradas
        working-directory: frontend
        run: npm run verificar:tablas

      # Un boton apagado NO DISPARA NINGUN EVENTO: no hay forma de preguntarle
      # por que. El usuario mira el formulario, no encuentra la diferencia y
      # concluye que el software esta roto. Paso en la exposicion. Si la
      # condicion de `disabled` mira el CONTENIDO de un campo, tiene que
      # decir cual falta.
      - name: Los botones apagados dicen que falta
        working-directory: frontend
        run: npm run verificar:botones

      # El codigo escribia `className="chip est-OPERATIVO"` y en styles.css no
      # habia NI UNA regla `.est-`: siete pantallas con los estados en gris
      # plano. No rompe nada —el navegador ignora la clase— asi que no hay
      # error, ni en consola ni en el build. Solo se ve mirando la pantalla.
      - name: Clases de CSS que el codigo usa y no existen
        working-directory: frontend
        run: npm run verificar:clases

      - name: Compilar
        working-directory: frontend
        run: npm run build

  # ---------------------------------------------------------------------------
  #  3) MIGRACIONES - evita la deuda tecnica silenciosa
  # ---------------------------------------------------------------------------
  #  Problema real que previene: alguien edita schema.prisma y hace push SIN
  #  crear la migracion. En local funciona (por db push), pero Railway aplica
  #  migraciones y queda desincronizado. Aqui se detecta al instante.
  # ---------------------------------------------------------------------------
  migraciones:
    name: Migraciones - sin desfase con el esquema
    runs-on: ubuntu-latest

    services:
      postgres:
        # PostgreSQL 18: la MISMA version mayor que produccion en Railway.
        # Estuvo en 16 mientras produccion ya corria 18.4: probar en una version
        # distinta a la que atiende la planta es pedir una sorpresa.
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_shadow
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_shadow?schema=public
      # DOS BASES DISTINTAS, y hace falta que sean dos.
      #
      # `migrate diff --from-migrations` reproduce las 40 migraciones desde
      # cero para compararlas con el esquema, y para eso necesita una base
      # DESECHABLE que BORRA Y RECREA. Prisma se niega —con razon— si esa base
      # es la misma que la principal:
      #
      #   Error: The shadow database you configured appears to be the same as
      #          the main database.
      #
      # Menos mal que se niega: si la aceptara, borraria la base principal para
      # hacer una comparacion.
      SHADOW_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_sombra?schema=public

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # El servicio de PostgreSQL solo crea la base de POSTGRES_DB. La segunda
      # —la desechable de arriba— hay que crearla a mano.
      - name: Crear la base de sombra
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d ci_shadow \
            -c 'CREATE DATABASE ci_sombra;'

      - name: Instalar dependencias
        working-directory: backend
        run: npm ci

      - name: Generar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      # Aplica TODAS las migraciones sobre una base vacia y limpia.
      # Si una migracion esta rota, se descubre aqui y no en produccion.
      - name: Aplicar migraciones sobre base limpia
        working-directory: backend
        run: npx prisma migrate deploy

      # --exit-code devuelve 2 si hay diferencias => el job falla.
      - name: Comprobar que el esquema coincide con las migraciones
        working-directory: backend
        run: |
          # PRISMA 7 (bloque 52) cambio DOS cosas de este comando:
          #
          #   --shadow-database-url   -> eliminado. La base de sombra se
          #                              declara ahora en prisma.config.ts.
          #   --to-schema-datamodel   -> eliminado. Ahora es --to-schema.
          #
          # El segundo no lo vi al migrar y tumbo este trabajo. El mensaje era
          # claro pero solo aparece al ejecutarlo:
          #   `--to-schema-datamodel` was removed. Please use `--[from/to]-schema`
          if ! npx prisma migrate diff \
              --from-migrations ./prisma/migrations \
              --to-schema ./prisma/schema.prisma \
              --exit-code ; then
            echo "::error::El esquema (schema.prisma) tiene cambios SIN migracion."
            echo "Solucion: cd backend && npx prisma migrate dev --name <nombre-del-cambio>"
            exit 1
          fi

      # `prisma db seed` ejecuta `node dist/seed.js`. A partir de PRISMA 7
      # (bloque 52) eso se declara en prisma.config.ts y NO en la clave
      # `prisma` del package.json, que se elimino. Ademas la v7 ya no ejecuta
      # la semilla sola despues de migrar: hay que invocarla, y por suerte
      # aqui siempre se invoco a mano.
      #
      # La semilla hay que COMPILARLA antes. Sin este
      # paso falla con "Cannot find module dist/seed.js".
      # Solo se compila la semilla: no hace falta construir todo el backend,
      # de eso ya se encarga el trabajo `backend`.
      - name: Compilar la semilla
        working-directory: backend
        # --rootDir . y no `prisma`: desde Prisma 7 la semilla importa el
        # cliente desde src/generated, que esta FUERA de prisma/, y con el
        # rootDir viejo TypeScript falla con TS6059. La salida pasa a ser
        # dist/prisma/seed.js, que es lo que declara prisma.config.ts.
        run: npx tsc prisma/seed.ts --outDir dist --rootDir . --module commonjs --target ES2021 --esModuleInterop --skipLibCheck

      # La semilla es el punto de partida de la planta. Si se rompe, el
      # despliegue queda sin roles, permisos ni jerarquia de Laminacion.
      - name: Verificar que la semilla funciona
        working-directory: backend
        run: npx prisma db seed

  # ---------------------------------------------------------------------------
  #  4) ARRANQUE REAL - el hueco que ya tumbo produccion una vez
  # ---------------------------------------------------------------------------
  #  QUE PREVIENE, EN CONCRETO
  #  El 01/08 una dependencia inyectada por constructor no estaba declarada en
  #  su modulo. Compilaba. Pasaba las pruebas. Y reventaba AL LEVANTAR, en
  #  produccion, porque es un dato de tiempo de ejecucion.
  #
  #  Se anadio `verificar:inyeccion` para cazar ese caso concreto leyendo el
  #  codigo, y funciona. Pero es un analisis estatico: sabe de constructores, no
  #  sabe de una variable de entorno que falta, de una migracion que choca con
  #  datos reales, ni de un modulo que se cae al inicializarse por cualquier
  #  otro motivo.
  #
  #  LA UNICA PRUEBA DE QUE LA APLICACION ARRANCA ES ARRANCARLA. Hasta hoy eso
  #  solo pasaba cuando Railway lo intentaba: en el peor momento posible, con la
  #  planta esperando.
  #
  #  Este trabajo levanta Postgres, aplica las 38 migraciones, siembra, compila,
  #  ARRANCA EL BACKEND DE VERDAD y le pide /health. Si no responde, falla aqui.
  #
  #  Va en un trabajo aparte y no dentro de `backend` a proposito: tarda minutos
  #  porque levanta una base, y el resto de comprobaciones tienen que seguir
  #  dando su respuesta en segundos.
  # ---------------------------------------------------------------------------
  arranque:
    name: Arranque real - la aplicacion levanta y responde
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci_arranque
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_arranque?schema=public
      # PRODUCCION a proposito. Es el modo en el que corre Pisco, y es el unico
      # en el que se validan de verdad la clave de cifrado y los secretos: en
      # desarrollo el codigo acepta valores por defecto y no probaria nada.
      NODE_ENV: production
      # Valores de USAR Y TIRAR, solo para este contenedor efimero. No son
      # secretos: la base se destruye al terminar el trabajo. Los de Pisco viven
      # en Railway y no aparecen en ningun archivo del repositorio.
      CREDENTIAL_ENC_KEY: clave-de-integracion-continua-no-usar-en-planta-0001
      JWT_SECRET: jwt-de-integracion-continua-no-usar-en-planta-0002
      JWT_REFRESH_SECRET: refresh-de-integracion-continua-no-usar-en-planta-03
      PORT: '3000'

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      # `--include=dev` NO ES DECORATIVO, Y AQUI SE PERDIO UNA TARDE.
      # ---------------------------------------------------------------------
      # Este trabajo declara `NODE_ENV: production` a nivel de JOB, porque es
      # el modo en el que corre Pisco y el unico en el que se validan de verdad
      # los secretos. Pero esa variable la ve TODO el trabajo, `npm ci`
      # incluido — y npm, al leer NODE_ENV=production, se salta las
      # devDependencies sin avisar de nada.
      #
      # Resultado: la instalacion terminaba en VERDE y el paso siguiente moria
      # con `sh: 1: nest: not found`, que parece un problema del compilador de
      # NestJS y no lo es: el fallo estaba tres pasos mas arriba, en un paso
      # que decia haber ido bien.
      #
      # `--include=dev` lo pide explicitamente y deja de depender de una
      # variable declarada en otra parte del archivo.
      - name: Instalar dependencias
        working-directory: backend
        run: npm ci --include=dev

      - name: Generar cliente Prisma
        working-directory: backend
        run: npx prisma generate

      # Lo MISMO que hace el contenedor de Railway al arrancar. Si una migracion
      # choca, se descubre aqui y no con la planta esperando.
      - name: Aplicar migraciones como en produccion
        working-directory: backend
        run: npx prisma migrate deploy

      # Compila la aplicacion Y la semilla, igual que el build real.
      - name: Compilar
        working-directory: backend
        run: npm run build

      - name: Sembrar
        working-directory: backend
        run: npx prisma db seed

      # === EL PASO QUE NO EXISTIA ===
      # Arranca el backend en segundo plano y espera a que /health responda.
      # 60 segundos es de sobra: en local levanta en menos de diez. Si se agota,
      # se vuelca el registro para poder ver POR QUE no arranco.
      - name: Arrancar el backend y esperar a /health
        working-directory: backend
        run: |
          node dist/main.js > arranque.log 2>&1 &
          PID=$!
          echo "Backend arrancando con PID $PID"

          for i in $(seq 1 60); do
            # `kill -0` no mata: comprueba que el proceso sigue vivo. Si se
            # murio, no tiene sentido seguir esperando 50 segundos mas.
            if ! kill -0 $PID 2>/dev/null; then
              echo "::error::El backend MURIO durante el arranque."
              cat arranque.log
              exit 1
            fi
            if curl -fsS http://127.0.0.1:3000/health > /dev/null 2>&1; then
              echo "OK: /health respondio a los $i segundos."
              cat arranque.log
              kill $PID 2>/dev/null || true
              exit 0
            fi
            sleep 1
          done

          echo "::error::/health no respondio en 60 segundos."
          cat arranque.log
          kill $PID 2>/dev/null || true
          exit 1

      # El autochequeo del bloque 44 escribe en el registro si la base no
      # coincide con el codigo. Aqui la base ACABA de sembrarse, asi que no
      # deberia encontrar ni un error: si lo encuentra, es que la semilla y el
      # codigo se han desincronizado y hay que verlo antes de desplegar.
      - name: El autochequeo no encuentra errores sobre una base recien sembrada
        working-directory: backend
        run: |
          if grep -q "ERROR(ES)" arranque.log; then
            echo "::error::El autochequeo encontro errores en una base recien sembrada."
            grep -E "Autochequeo|\[[A-Z_]+\]" arranque.log
            exit 1
          fi
          echo "Autochequeo limpio sobre base recien sembrada."
          grep -E "Autochequeo" arranque.log || true
