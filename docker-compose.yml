# =============================================================================
#  SGIT-CCTV — Orquestación de servicios (despliegue on-premise Planta Pisco)
#  Levanta: PostgreSQL, Redis, MinIO, API (NestJS) y Nginx (reverse proxy)
# =============================================================================
name: sgit-cctv

services:
  db:
    # PostgreSQL 18: la misma version mayor que produccion en Railway.
    # Desarrollar en 16 mientras la planta corre 18 es probar otra cosa.
    image: postgres:18-alpine
    container_name: sgit_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sgit}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sgit_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sgit_cctv}
    volumes:
      # OJO CON LA RUTA: PostgreSQL 18 cambio la convencion.
      # Hasta la 17 el volumen se montaba en /var/lib/postgresql/DATA.
      # Desde la 18 la imagen quiere el volumen UN NIVEL MAS ARRIBA y ella
      # coloca los datos en un subdirectorio con el numero de version
      # (/var/lib/postgresql/18/docker), para poder hacer `pg_upgrade --link`
      # sin cruzar el limite del punto de montaje.
      # Con la ruta antigua el contenedor arranca y MUERE con un error largo
      # que habla de pg_ctlcluster. Paso aqui al subir de 16 a 18.
      - db_data:/var/lib/postgresql
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sgit} -d ${POSTGRES_DB:-sgit_cctv}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sgit_net]

  redis:
    image: redis:7-alpine
    container_name: sgit_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [sgit_net]

  minio:
    image: minio/minio:latest
    container_name: sgit_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-sgit_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-sgit_minio_pass}
    volumes:
      - minio_data:/data
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: [sgit_net]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sgit_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: postgresql://${POSTGRES_USER:-sgit}:${POSTGRES_PASSWORD:-sgit_pass}@db:5432/${POSTGRES_DB:-sgit_cctv}?schema=public
      REDIS_URL: redis://redis:6379
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-sgit_minio}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-sgit_minio_pass}
      JWT_SECRET: ${JWT_SECRET:-change_me_in_prod}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-900s}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change_me_refresh}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CREDENTIAL_ENC_KEY: ${CREDENTIAL_ENC_KEY:-dev-credential-key-change-me}
      # SIN ESTO EL API NO ARRANCA. `main.ts` falla en cerrado cuando
      # NODE_ENV=production y no hay lista blanca de origenes — a proposito,
      # porque un servidor que levanta con CORS abierto no se nota nunca.
      # Aqui se declaran los origenes del frontend local.
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:8080,http://localhost,http://localhost:5173}
      PORT: 3000
    ports:
      - "${API_PORT:-3000}:3000"
    networks: [sgit_net]

  web:
    # El frontend. Vite "hornea" la URL de la API EN TIEMPO DE BUILD, no la
    # lee al arrancar: por eso va como argumento de build y no como variable
    # de entorno. Cambiarla obliga a reconstruir la imagen, no a reiniciarla.
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000/api/v1}
    container_name: sgit_web
    restart: unless-stopped
    depends_on: [api]
    environment:
      PORT: 8080
    ports:
      - "${WEB_PORT:-8080}:8080"
    networks: [sgit_net]

  nginx:
    image: nginx:1.27-alpine
    container_name: sgit_nginx
    restart: unless-stopped
    depends_on: [api]
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "${HTTP_PORT:-80}:80"
    networks: [sgit_net]

volumes:
  db_data:
  redis_data:
  minio_data:

networks:
  sgit_net:
    driver: bridge
